org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.r8.optimizedResourceShrinking=true
kotlin.code.style=official
# AGP 9 makes unit tests only for the tested build type (debug); CI also runs them against the
# minified release variant (:app:testReleaseUnitTest, android.yml).
android.onlyEnableUnitTestForTheTestedBuildType=false
