# The Python package (python/): tests every push; on a python-v* tag, publishes to PyPI
# (trusted publishing: this file's name and the `pypi` environment are what PyPI trusts)
# and creates the GitHub Release. Server releases use v* tags and server.yml.
#
# The publish needs every test job on the tagged commit itself: unit tests, the package
# against the real server it downloads (Linux amd64/arm64, macOS arm64), and
# Server.connect() through adbc-driver-hardcharger from PyPI (the `client` job: it fails
# until adbc-driver-warpsql and adbc-driver-hardcharger are published, which is the order
# they must be released in, since `hardcharger[adbc]` needs them).
name: workflow

on:
  push:
    branches: [main]
    tags: ["python-v*"]
    paths-ignore: ["server/**", "third_party/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs on a branch are cancelled; a run on a tag never is.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: python

# A newer run on the same branch makes an older one pointless: cancel it. Never on a tag:
# a release run must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      # uv pip, not uv run: uv run locks the [adbc] extra too, and adbc-driver-hardcharger
      # isn't on PyPI yet.
      - name: Install
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -e . --group dev
      - name: Lint
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests
      - name: Unit tests
        run: .venv/bin/python -m pytest -q -m "not integration and not download"
      - name: Unit tests on the oldest Python supported (3.10)
        run: |
          uv venv /tmp/py310 --python 3.10
          uv pip install --python /tmp/py310/bin/python -e . --group dev
          /tmp/py310/bin/python -m pytest -q -p no:cacheprovider -m "not integration and not download"
      - name: Build
        run: uv build
      - name: Check the distributions
        run: uvx twine check dist/*
      - name: Install the wheel and import it
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          /tmp/wheel-check/bin/python -c "import hardcharger; print(hardcharger.__version__)"
          test -x /tmp/wheel-check/bin/hardcharger-server
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/python-v')
        run: |
          version="$(uv version --short)"
          [ -n "$version" ] || { echo "no version found"; exit 1; }
          [ "python-v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != python-v$version"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: python/dist/

  # The package downloads the release it pins (this repository's own releases, which its
  # GITHUB_TOKEN can read) and runs the integration tests against it. The download test
  # also proves the real download, digest check and cache on each platform.
  server:
    name: real server (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    env:
      HARDCHARGER_INSTALL_TOKEN: ${{ github.token }}
      HARDCHARGER_PY_TEST_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -e . --group dev
      - name: Download the server with the package itself
        run: |
          binary="$(.venv/bin/python -m hardcharger download)"
          "$binary" --version
          echo "HARDCHARGER_PY_TEST_SERVER_BINARY=$binary" >> "$GITHUB_ENV"
      - name: Integration and download tests
        run: .venv/bin/python -m pytest -q -m "(integration and not client) or download"

  client:
    name: Server.connect() through adbc-driver-hardcharger
    runs-on: ubuntu-24.04
    env:
      HARDCHARGER_INSTALL_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install, with the [adbc] extra from PyPI
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -e ".[adbc]" --group dev
      - name: Download the server
        run: echo "HARDCHARGER_PY_TEST_SERVER_BINARY=$(.venv/bin/python -m hardcharger download)" >> "$GITHUB_ENV"
      - name: Client tests
        run: .venv/bin/python -m pytest -q -m client

  publish:
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: [test, server, client]
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: .
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract this version's CHANGELOG section
        run: |
          version="${GITHUB_REF_NAME#python-v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' python/CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "no CHANGELOG section for $version"; exit 1; }
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/*
