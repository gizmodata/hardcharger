# The Python package (python/): tests every push; on a python-v* tag, publishes to PyPI
# (trusted publishing: this file's name and the `pypi` environment are what PyPI trusts)
# and creates the GitHub Release. Server releases use v* tags and server.yml.
#
# A server release publishes its matching package itself: once server.yml's release job has
# published the GitHub Release vX.Y.Z, its downstream job dispatches this workflow on that tag
# with `release: X.Y.Z`. Such a run publishes only when it runs on the tag vX.Y.Z, that release
# is published (not a draft), the package is exactly X.Y.Z (X.Y.ZrcN for X.Y.Z-rc.N), and every
# test job below passes; it then creates python-vX.Y.Z on the same commit. A python-v* tag
# pushed by hand still publishes a Python-only .postN fix.
#
# The publish needs every test job on the tagged commit itself: unit tests, the package
# against the real server it downloads (Linux amd64/arm64, macOS arm64), and
# Server.connect() through adbc-driver-hardcharger from PyPI (the `client` job).
#
# The `client` job runs on python-v* tags only. It installs the `[adbc]` extra from PyPI,
# where adbc-driver-hardcharger (and adbc-driver-warpsql under it) are not published yet,
# so on every main push and pull request it could only fail at the install, and main was
# red for that alone. On a tag it still runs and still gates the publish: a python-v* tag
# can't ship until those drivers are on PyPI, which is the order they must be released in.
name: workflow

on:
  push:
    branches: [main]
    tags: ["python-v*"]
    paths-ignore: ["server/**", "third_party/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      client:
        description: Also test Server.connect() with the published ADBC driver before tagging
        type: boolean
        default: false
      release:
        description: "Publish the package for this server release (X.Y.Z or X.Y.Z-rc.N; run on its tag vX.Y.Z). Set by server.yml after the release"
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    working-directory: python

# A newer run on the same branch makes an older one pointless: cancel it. Never on a tag:
# a release run must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Python package tracks the server version
        working-directory: .
        env:
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/python-v* ]]; then args+=(--python-tag "$GITHUB_REF_NAME"); fi
          # A release publish: on the server's own tag, after its GitHub Release is published,
          # with exactly the matching package version (--server-tag refuses a .postN).
          if [ -n "$RELEASE" ]; then
            [ "$GITHUB_REF" = "refs/tags/v$RELEASE" ] || { echo "release $RELEASE must run on its tag v$RELEASE, not $GITHUB_REF"; exit 1; }
            gh release view "v$RELEASE" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft == false' | grep -qx true \
              || { echo "the GitHub Release v$RELEASE is not published"; exit 1; }
            args+=(--server-tag "v$RELEASE")
          fi
          python3 .github/scripts/check_python_version.py "${args[@]}"
      # Remove at Hardcharger 2.0.0 together with .github/scripts/check_no_version_labels.py:
      # until then the docs say "Hardcharger", never "Hardcharger 0.x".
      - name: No version labels in the docs
        working-directory: .
        run: python3 .github/scripts/check_no_version_labels.py
      - uses: astral-sh/setup-uv@v10.3.0
      # uv pip, not uv run: uv run locks the [adbc] extra too, and adbc-driver-hardcharger
      # isn't on PyPI yet.
      - name: Install
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -e . --group dev
      - name: Lint
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests
      - name: Unit tests
        run: .venv/bin/python -m pytest -q -m "not integration and not download"
      - name: Unit tests on the oldest Python supported (3.10)
        run: |
          uv venv /tmp/py310 --python 3.10
          uv pip install --python /tmp/py310/bin/python -e . --group dev
          /tmp/py310/bin/python -m pytest -q -p no:cacheprovider -m "not integration and not download"
      - name: Build
        run: uv build
      - name: Check the distributions
        run: uvx twine check dist/*
      - name: Install the wheel and import it
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          /tmp/wheel-check/bin/python -c "import hardcharger; print(hardcharger.__version__)"
          test -x /tmp/wheel-check/bin/hardcharger-server
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/python-v')
        run: |
          version="$(uv version --short)"
          [ -n "$version" ] || { echo "no version found"; exit 1; }
          [ "python-v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != python-v$version"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: python/dist/

  # The package downloads the release it pins (this repository's own releases, which its
  # GITHUB_TOKEN can read) and runs the integration tests against it. The download test
  # also proves the real download, digest check and cache on each platform.
  server:
    name: real server (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    env:
      HARDCHARGER_INSTALL_TOKEN: ${{ github.token }}
      HARDCHARGER_PY_TEST_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -e . --group dev
      - name: Download the server with the package itself
        run: |
          binary="$(.venv/bin/python -m hardcharger download)"
          "$binary" --version
          echo "HARDCHARGER_PY_TEST_SERVER_BINARY=$binary" >> "$GITHUB_ENV"
      - name: Integration and download tests
        run: .venv/bin/python -m pytest -q -m "(integration and not client) or download"

  client:
    name: Server.connect() through adbc-driver-hardcharger
    # Every publish tests it; a manual run can prove the same gate once the driver is published.
    if: startsWith(github.ref, 'refs/tags/python-v') || (github.event_name == 'workflow_dispatch' && (inputs.client || inputs.release != ''))
    runs-on: ubuntu-24.04
    env:
      HARDCHARGER_INSTALL_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install, with the [adbc] extra from PyPI
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -e ".[adbc]" --group dev
      - name: Download the server
        run: echo "HARDCHARGER_PY_TEST_SERVER_BINARY=$(.venv/bin/python -m hardcharger download)" >> "$GITHUB_ENV"
      - name: Client tests
        run: .venv/bin/python -m pytest -q -m client

  publish:
    if: startsWith(github.ref, 'refs/tags/python-v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [test, server, client]
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: .
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # The package's version (python-vX.Y.Z's, or a server release's matching X.Y.Z), and the
      # tag the release gets: a python-v* run's own, or one created on this commit.
      - name: Extract this version's CHANGELOG section
        id: notes
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')
          [ -n "$version" ] || { echo "no version in python/pyproject.toml"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/python-v* ]] && [ "python-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != python-v$version"; exit 1
          fi
          echo "tag=python-v$version" | tee -a "$GITHUB_OUTPUT"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' python/CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "no CHANGELOG section for $version"; exit 1; }
          # PEP 440 pre-releases: 2.0.0a1, 2.0.0b1, 2.0.0rc1.
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" | tee -a "$GITHUB_OUTPUT"
      # Never the repository's latest release: that is the server's (releases/latest, which
      # the installer resolves), and a python-v* tag publishes no server.
      # A tag this creates with GITHUB_TOKEN starts no workflow, so it can't publish twice.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: dist/*
          prerelease: ${{ steps.notes.outputs.prerelease == 'true' }}
          make_latest: "false"
