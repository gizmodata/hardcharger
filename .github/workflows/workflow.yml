# The Python package (python/): tests every push; on a python-v* tag, publishes to PyPI
# (trusted publishing: this file's name and the `pypi` environment are what PyPI trusts)
# and creates the GitHub Release. Server releases use v* tags and server.yml.
name: workflow

on:
  push:
    branches: [main]
    tags: ["python-v*"]
    paths-ignore: ["server/**", "third_party/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: python

# A newer run on the same branch makes an older one pointless: cancel it. Never on a tag:
# a release run must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Run the tests
        run: uv run --group dev pytest -q
      - name: Build
        run: uv build
      - name: Check the distributions
        run: uvx twine check dist/*
      - name: Install the wheel and import it
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          /tmp/wheel-check/bin/python -c "import hardcharger; print(hardcharger.__version__)"
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/python-v')
        run: |
          version="$(uv version --short)"
          [ -n "$version" ] || { echo "no version found"; exit 1; }
          [ "python-v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != python-v$version"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: python/dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: .
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract this version's CHANGELOG section
        run: |
          version="${GITHUB_REF_NAME#python-v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' python/CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "no CHANGELOG section for $version"; exit 1; }
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/*
