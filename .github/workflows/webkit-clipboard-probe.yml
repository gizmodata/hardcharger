name: WebKit clipboard probe
on:
  push:
    branches: [debug/webkit-clipboard]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: xvfb-run --auto-servernum node scripts/webkit-clipboard-probe.mjs
