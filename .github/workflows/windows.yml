# The Hardcharger server on Windows (x64 and arm64, MSVC): builds the dependencies, the
# server, the client and the Warp SQL reference server, runs the unit tests, the server
# and client suites and the Warp SQL conformance suite (against both servers), and
# packages hardcharger-windows-{amd64,arm64}.zip and an MSI of each. server.yml calls it
# (its `windows` job), on the same events as its other builds; its concurrency is
# server.yml's (a called workflow's own would share the caller's group and cancel it).
# With `sign` (server.yml: every v* tag, and a manual run with `sign`), the `sign` job signs
# both executables of each zip with GizmoData's code-signing certificate (Azure Key Vault,
# through the `production` environment's OIDC credential) before the zip and the MSI are
# made from them, and the msi job signs each MSI; without it, everything stays unsigned.
# With `warm` (server.yml's `windows-warm` job, on a push to main whose tests are skipped),
# only the compile-cache warm-up jobs at the end run, for the platforms it lists.
name: windows

on:
  workflow_call:
    inputs:
      failure_repro:
        description: Also run the failed-statement conformance cases 200 times against each server
        type: boolean
        default: false
      warm:
        description: >-
          A JSON list of the platforms (windows-amd64, windows-arm64) whose compile cache to
          warm: then only those are built, without tests or packages (server.yml's warm-up)
        type: string
        default: ""
      tested_run:
        description: With warm, the run that tested this commit (its web UI artifact is used)
        type: string
        default: ""
      sign:
        description: Sign the executables and the MSIs (production environment; server.yml decides)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build and test (${{ matrix.name }})
    if: inputs.warm == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          # (Each leg and step marked &name is reused, unchanged, by the compile-cache
          # warm-up jobs at the end; YAML anchors.)
          - &leg-windows-amd64
            name: windows-amd64
            runner: windows-latest
            arch: x64
            test_python: "3.14"
          - &leg-windows-arm64
            name: windows-arm64
            runner: windows-11-arm
            arch: arm64
            # psycopg-binary and pyarrow publish no win_arm64 wheels: the test harnesses run
            # on x64 Python (emulated); the server under test is the native arm64 build.
            test_python: cpython-3.14-windows-x86_64-none
    runs-on: ${{ matrix.runner }}
    env: &build-env
      # OpenSSL from vcpkg: static libraries on the static C runtime (/MT), as everything
      # here is built (DuckDB always builds with it on MSVC).
      VCPKG_TRIPLET: ${{ matrix.arch }}-windows-static
      # cl.exe for every CMake project, never a MinGW gcc a runner image puts on PATH.
      CC: cl
      CXX: cl
    steps:
      - &build-checkout
        uses: actions/checkout@v7
      # The web UI every build embeds (server.yml's web-ui job).
      - uses: actions/download-artifact@v8
        with:
          name: hardcharger-ui
          path: server/.web-ui
      - &build-ui-tarball
        name: The web UI tarball
        run: |
          shopt -s nullglob
          ui=("$PWD"/server/.web-ui/hardcharger-ui-*.tar.gz)
          [ ${#ui[@]} -eq 1 ] || { echo "expected one hardcharger-ui tarball, found: ${ui[*]}"; exit 1; }
          echo "HARDCHARGER_UI_TARBALL=$(cygpath -m "${ui[0]}")" >> "$GITHUB_ENV"
      # The warp-sql submodule is private: fetch it with its read-only deploy key.
      - &build-submodule
        name: Fetch the warp-sql submodule
        env:
          DEPLOY_KEY: ${{ secrets.WARP_SQL_DEPLOY_KEY }}
        run: |
          key="$(cygpath -u "$RUNNER_TEMP")/warp_sql_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git -c url.git@github.com:gizmodata/warp-sql.git.insteadOf=https://github.com/gizmodata/warp-sql.git \
              submodule update --init --depth 1
          rm -f "$key"

      # Passes the architecture to vcvarsall (arm64 on the arm64 runner selects the native
      # ARM64-hosted toolchain). Its environment reaches the bash steps too.
      - &build-msvc
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      # Every cache below is keyed on the exact MSVC toolset: cached CMake trees record
      # the compiler's absolute path, so a runner image with another toolset must build
      # cold rather than fail at configure.
      - &build-toolchain
        name: Toolchain
        id: msvc
        run: |
          [ -n "$VCToolsVersion" ] || { echo "VCToolsVersion is not set: did msvc-dev-cmd run?"; exit 1; }
          echo "version=$VCToolsVersion" >> "$GITHUB_OUTPUT"
          echo "MSVC $VCToolsVersion ($VCToolsInstallDir)"
          # vcvarsall points VCPKG_ROOT at Visual Studio's own copy; use the runner's.
          echo "VCPKG_ROOT=C:\\vcpkg" >> "$GITHUB_ENV"
          cmake --version | head -1
          ninja --version

      # Git for Windows has sha256sum but no shasum, which server/scripts/ci-deps-key.sh
      # (the dependency caches' keys) calls as `shasum -a 256`.
      - &build-shasum
        name: shasum
        run: |
          bin="$(cygpath -u "$RUNNER_TEMP")/bin"
          mkdir -p "$bin"
          printf '#!/usr/bin/env bash\n[ "${1:-}" = -a ] && shift 2\nexec sha256sum "$@"\n' > "$bin/shasum"
          chmod +x "$bin/shasum"
          cygpath -w "$bin" >> "$GITHUB_PATH"
          echo abc | "$bin/shasum" -a 256

      # The Windows libraries vcpkg builds (static, on the static C runtime), listed in
      # .github/windows-vcpkg-packages.txt: OpenSSL for everything, and libpq, libcurl and
      # CRoaring for DuckDB's built-in extensions (the postgres scanner, httpfs, ducklake).
      - &build-vcpkg-key
        name: vcpkg libraries cache key
        id: vcpkg
        run: |
          commit=$(git -C /c/vcpkg rev-parse --short=12 HEAD)
          list=$(sha256sum .github/windows-vcpkg-packages.txt | cut -c1-12)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "key=vcpkg-${VCPKG_TRIPLET}-msvc${{ steps.msvc.outputs.version }}-$commit-$list" >> "$GITHUB_OUTPUT"
      - &build-vcpkg-restore
        uses: actions/cache/restore@v6
        id: vcpkg-cache
        with:
          path: C:\vcpkg\installed
          key: ${{ steps.vcpkg.outputs.key }}
      - &build-vcpkg-build
        name: Build the vcpkg libraries
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          # (The checkout has Windows line ends.)
          mapfile -t packages < <(tr -d '\r' < .github/windows-vcpkg-packages.txt)
          /c/vcpkg/vcpkg.exe install "${packages[@]/%/:$VCPKG_TRIPLET}" --clean-after-build
      - &build-vcpkg-save
        uses: actions/cache/save@v6
        if: steps.vcpkg-cache.outputs.cache-hit != 'true' && !startsWith(github.ref, 'refs/tags/')
        with:
          path: C:\vcpkg\installed
          key: ${{ steps.vcpkg.outputs.key }}

      # Arrow, replxx and DuckDB: one cache each (.github/actions/dep-cache, as on the other
      # platforms), keyed on the dependency's own recipes, server/scripts/windows-deps.sh's
      # Windows part and the MSVC toolset (DuckDB's also on vcpkg's libraries), so a change
      # to one never rebuilds another. DuckDB takes 35-70 minutes cold.
      - &build-dep-arrow
        name: Arrow (cached)
        uses: ./.github/actions/dep-cache
        with:
          dependency: arrow
          platform: ${{ matrix.name }}
          toolchain: MSVC ${{ steps.msvc.outputs.version }}
          extra-recipes: server/scripts/windows-deps.sh .github/cmake/msvc-static-crt.cmake
          build: server/scripts/windows-deps.sh
      - &build-dep-replxx
        name: replxx (cached)
        uses: ./.github/actions/dep-cache
        with:
          dependency: replxx
          platform: ${{ matrix.name }}
          toolchain: MSVC ${{ steps.msvc.outputs.version }}
          extra-recipes: server/scripts/windows-deps.sh .github/cmake/msvc-static-crt.cmake
          build: server/scripts/windows-deps.sh
      - &build-dep-duckdb
        name: DuckDB (cached)
        uses: ./.github/actions/dep-cache
        with:
          dependency: duckdb
          platform: ${{ matrix.name }}
          toolchain: MSVC ${{ steps.msvc.outputs.version }} vcpkg ${{ steps.vcpkg.outputs.commit }}
          extra-recipes: >-
            server/scripts/windows-deps.sh server/scripts/deps-duckdb-windows.sh
            .github/cmake/windows-vcpkg.cmake .github/cmake/msvc-static-crt.cmake
            .github/windows-vcpkg-packages.txt
          build: server/scripts/windows-deps.sh

      # The server's and warp-duckdb's own sources (and what they fetch: Boost.URL, yaml-cpp,
      # googletest, zlib) compile through sccache, as on Linux and macOS: about 25 minutes
      # cold, the longest part of the job. Its directory is one actions/cache entry per arch
      # and MSVC toolset (.github/actions/sccache-dir). Fail-open: when the action can't
      # install sccache, or its server won't answer, server/scripts/sccache-launcher.sh
      # turns the launcher off and the build runs uncached. (A Release build compiles no
      # debug information, so there is no shared /Zi PDB for sccache to refuse; a debug
      # build here would need CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded, i.e. /Z7.)
      - &build-sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
      - &build-sccache-settings
        name: sccache settings
        run: |
          echo "SCCACHE_DIR=$(cygpath -m "$GITHUB_WORKSPACE/.sccache")" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=2G" >> "$GITHUB_ENV"
      - &build-sccache-restore
        name: sccache directory (restore)
        uses: ./.github/actions/sccache-dir
        with:
          mode: restore
          name: ${{ matrix.name }}
          toolchain: MSVC ${{ steps.msvc.outputs.version }}
      - &build-launcher
        name: The compiler launcher
        run: |
          read -ra launcher <<< "$(server/scripts/sccache-launcher.sh || true)"
          # C++20 module scanning (CMake's default for MSVC) is off: nothing here is a module,
          # and its per-source scan steps and modmap files only slow the build and the cache.
          echo "HARDCHARGER_CMAKE_LAUNCHER=${launcher[*]} -DCMAKE_CXX_SCAN_FOR_MODULES=OFF" >> "$GITHUB_ENV"

      - &build-server
        name: Build the server
        id: server
        run: |
          start=$SECONDS
          openssl="/c/vcpkg/installed/$VCPKG_TRIPLET"
          read -ra launcher <<< "$HARDCHARGER_CMAKE_LAUNCHER"
          # vcpkg's toolchain (windows-vcpkg.cmake) finds the libraries DuckDB's built-in
          # extensions link, as DuckDB's own build did.
          cmake -S server -B server/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="$(cygpath -m "$PWD/.github/cmake/windows-vcpkg.cmake")" \
                -DOPENSSL_ROOT_DIR="$(cygpath -m "$openssl")" -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE \
                -DHARDCHARGER_WEB_UI="$HARDCHARGER_UI_TARBALL" "${launcher[@]}"
          cmake --build server/build
          server/build/hardcharger-server.exe --version
          server/build/hardcharger-server.exe --print-duckdb-version
          echo "server built in $(( SECONDS - start )) s"
      # The Warp SQL reference server (warp-sql has no CI of its own), on the same deps.
      - &build-warp
        name: Build warp-duckdb
        id: warp
        run: |
          start=$SECONDS
          openssl="/c/vcpkg/installed/$VCPKG_TRIPLET"
          deps="$(cygpath -m "$PWD/server/.deps")"
          read -ra launcher <<< "$HARDCHARGER_CMAKE_LAUNCHER"
          cmake -S third_party/warp-sql/cpp -B build-warp -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="$(cygpath -m "$PWD/.github/cmake/windows-vcpkg.cmake")" \
                -DOPENSSL_ROOT_DIR="$(cygpath -m "$openssl")" -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE \
                -DWARPSQL_ARROW_PREFIX="$deps/arrow-install" -DWARPSQL_DUCKDB_PREFIX="$deps/duckdb-install" \
                -DWARPSQL_BUILD_TESTS=ON "${launcher[@]}"
          cmake --build build-warp --target warp-duckdb warpsql-client-tests warpsql-sdk-tests
          echo "warp-duckdb built in $(( SECONDS - start )) s"
      - name: sccache directory (save)
        if: always()
        uses: ./.github/actions/sccache-dir
        with:
          mode: save
          name: ${{ matrix.name }}
          toolchain: MSVC ${{ steps.msvc.outputs.version }}

      # Windows Error Reporting writes a minidump of any test program that crashes, uploaded
      # below on failure: the unit tests once segfaulted at exit after every test passed
      # (2026-10-18, 1 run in 30), with no stack to go on.
      - name: Crash dumps on
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'crash-dumps'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($exe in 'hardcharger-unit-tests.exe', 'warpsql-client-tests.exe', 'warpsql-sdk-tests.exe',
                           'hardcharger-server.exe', 'warp-duckdb.exe', 'hardcharger.exe') {
            $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\$exe"
            New-Item -Force -Path $key | Out-Null
            Set-ItemProperty -Path $key -Name DumpFolder -Value $dir -Type ExpandString
            Set-ItemProperty -Path $key -Name DumpType -Value 1 -Type DWord   # minidump
            Set-ItemProperty -Path $key -Name DumpCount -Value 10 -Type DWord
          }
      - name: Unit tests
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: server/build/hardcharger-unit-tests.exe --gtest_brief=1
      # The Warp SQL client library's own tests (unit, and live against warp-duckdb).
      - name: Client library tests
        if: ${{ !cancelled() && steps.warp.outcome == 'success' }}
        run: build-warp/warpsql-client-tests.exe --gtest_brief=1
      # The SDK's own unit tests (the security-event limiter).
      - name: SDK unit tests
        if: ${{ !cancelled() && steps.warp.outcome == 'success' }}
        run: build-warp/warpsql-sdk-tests.exe --gtest_brief=1

      # PostgreSQL for the access-control grant store (the tests fail without it). The
      # x64 image ships PostgreSQL; elsewhere EnterpriseDB's x64 binaries (emulated on arm64).
      - name: Start PostgreSQL
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: |
          pgbin=""
          for dir in "${PGBIN:-}" /c/Program\ Files/PostgreSQL/*/bin; do
            if [ -n "$dir" ] && [ -x "$dir/initdb.exe" ]; then pgbin="$dir"; fi
          done
          if [ -z "$pgbin" ]; then
            curl -sSfL -o "$RUNNER_TEMP/pg.zip" https://get.enterprisedb.com/postgresql/postgresql-17.6-1-windows-x64-binaries.zip
            pwsh -NoProfile -Command "Expand-Archive -Path '$RUNNER_TEMP/pg.zip' -DestinationPath '$RUNNER_TEMP/pg-bin'"
            pgbin="$(cygpath -u "$RUNNER_TEMP")/pg-bin/pgsql/bin"
          fi
          echo "PostgreSQL from $pgbin"
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          # Passwords are checked, as in the Linux jobs' container.
          printf 'hardcharger\n' > "$tmp/pgpass"
          "$pgbin/initdb.exe" -D "$tmp/pg" -U hardcharger --auth=scram-sha-256 --pwfile="$tmp/pgpass" -E UTF8
          "$pgbin/pg_ctl.exe" -D "$tmp/pg" -o "-p 55433" -l "$tmp/pg.log" -w start
          PGPASSWORD=hardcharger "$pgbin/createdb.exe" -h 127.0.0.1 -p 55433 -U hardcharger hardcharger

      # Its cache key from the two test projects only: scanning the whole workspace for
      # lock files once failed on a file in a build tree (EPERM).
      - uses: astral-sh/setup-uv@v10.3.0
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        with:
          cache-dependency-glob: |
            server/tests/pyproject.toml
            third_party/warp-sql/conformance/pyproject.toml
      # Everything, access control and the client included, on the one build, the one that
      # ships. Deselected by marker, visibly: the DuckLake suites (Docker's PostgreSQL and
      # S3 containers, which Windows runners can't run; as on macOS) and the client's
      # cases at a terminal (pexpect.spawn needs a pty, which Windows lacks).
      - name: Hardcharger tests
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        working-directory: server/tests
        env:
          PYTHONUTF8: "1"  # the servers and the client write UTF-8, not the ANSI code page
        run: |
          uv venv .venv --python ${{ matrix.test_python }}
          uv pip install --python .venv/Scripts/python.exe -r pyproject.toml
          # In parallel (pytest-xdist, as server.yml), then the `serial` tests alone.
          .venv/Scripts/python.exe -m pytest -q -rfE -n 4 -m "not serial and not services and not pty" --durations=10
          .venv/Scripts/python.exe -m pytest -q -rfE -m "serial and not services and not pty" --durations=5
      - name: Warp SQL conformance suite (Hardcharger)
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        working-directory: third_party/warp-sql/conformance
        env:
          WARP_SQL_TEST_SERVER_PASSWORD_ENV: HARDCHARGER_ADMIN_PASSWORD
          WARP_SQL_TEST_SERVER_USERNAME: warp
          WARP_SQL_TEST_SERVER_IDLE_FLAG: --session-idle-timeout
          # The flag naming the client CA in the mutual-TLS tests (test_mtls.py).
          WARP_SQL_TEST_SERVER_MTLS_FLAG: --mtls-ca-cert
          # Hardcharger's flag for the CORS allow-list (test_http.py's credentials tests).
          WARP_SQL_TEST_SERVER_CORS_FLAG: --cors-origins
          # How test_oauth_browser.py configures browser sign-in on Hardcharger (a template).
          WARP_SQL_TEST_SERVER_OAUTH_ARGS: >-
            --token-allowed-issuer {issuer} --token-allowed-audience {client_id} --token-default-role admin
            --token-authorized-emails {identity} --oauth-client-id {client_id} --oauth-base-url {base_url}
            --oauth-provider-name {provider} --oauth-max-flows {max_flows}
          WARP_SQL_TEST_SERVER_OAUTH_SECRET_ENV: HARDCHARGER_OAUTH_CLIENT_SECRET
          # One-signal draining (test_lifecycle.py) waits this long for running work.
          WARP_SQL_TEST_SERVER_DRAIN_FLAG: --shutdown-grace-period-seconds
          HARDCHARGER_ADMIN_USERNAME: warp
          HARDCHARGER_PRINT_QUERIES: "false"
        run: |
          uv venv .venv --python ${{ matrix.test_python }}
          uv pip install --python .venv/Scripts/python.exe -e .
          WARP_SQL_TEST_SERVER_BINARY="$(cygpath -m "$GITHUB_WORKSPACE/server/build/hardcharger-server.exe")" \
            .venv/Scripts/python.exe -m pytest -q -rfE
      - name: Warp SQL conformance suite (warp-duckdb)
        if: ${{ !cancelled() && steps.warp.outcome == 'success' }}
        working-directory: third_party/warp-sql/conformance
        run: |
          WARP_SQL_TEST_SERVER_BINARY="$(cygpath -m "$GITHUB_WORKSPACE/build-warp/warp-duckdb.exe")" \
            .venv/Scripts/python.exe -m pytest -q -rfE

      # On request (server.yml's failure_repro input, or [stream-repro] in a pushed head
      # commit's message): every way a running statement can fail before or during its
      # answer (streamed, split, prepared), 200 times against each server. The only
      # acceptable answers are the error response or an incomplete stream, with the
      # statement's own error.
      - name: Failed-statement answers, 200 times
        if: ${{ !cancelled() && steps.warp.outcome == 'success' && (inputs.failure_repro || contains(github.event.head_commit.message, '[stream-repro]')) }}
        working-directory: third_party/warp-sql/conformance
        env:
          PYTHONUTF8: "1"
          HARDCHARGER_ADMIN_USERNAME: warp
          HARDCHARGER_PRINT_QUERIES: "false"
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/failure-repro.sh" \
            "$(cygpath -m "$GITHUB_WORKSPACE/server/build/hardcharger-server.exe")" \
            "$(cygpath -m "$GITHUB_WORKSPACE/build-warp/warp-duckdb.exe")" .venv/Scripts/python.exe

      # The same layout as the other platforms' tarballs: bin/ (the server and the client,
      # single-file executables: every dependency and the C++ runtime linked in), LICENSE,
      # CHANGELOG.md and the third-party notices, THIRD_PARTY_NOTICES.md ending with the
      # libraries this build links from vcpkg (.github/scripts/vcpkg-notices.sh: their
      # versions and copyright files) and the embedded web UI's THIRD_PARTY_NOTICES-web-ui.txt.
      # The import gate fails on any DLL but Windows' own.
      - name: Package
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: |
          stage="dist/hardcharger-${{ matrix.name }}"
          # The two executables by hand, not `cmake --install`: jwt-cpp's install rules
          # would add its headers (include/) and CMake package files (cmake/).
          mkdir -p "$stage/bin"
          cp server/build/hardcharger-server.exe server/build/hardcharger.exe "$stage/bin/"
          # The server and the client ship, nothing else (never the tests, never a DLL).
          test "$(ls "$stage/bin" | tr '\n' ' ')" = "hardcharger-server.exe hardcharger.exe "
          .github/scripts/check-windows-imports.sh "$stage/bin/hardcharger-server.exe" "$stage/bin/hardcharger.exe"
          cp LICENSE CHANGELOG.md THIRD_PARTY_NOTICES.md "$stage/"
          .github/scripts/vcpkg-notices.sh /c/vcpkg "$VCPKG_TRIPLET" >> "$stage/THIRD_PARTY_NOTICES.md"
          # (A POSIX path: GNU tar reads the C: of a Windows one as a remote host.)
          tar -xzOf "$(cygpath -u "$HARDCHARGER_UI_TARBALL")" hardcharger-ui/third-party-notices.txt \
            > "$stage/THIRD_PARTY_NOTICES-web-ui.txt"
          test "$(export LC_ALL=C; cd "$stage" && printf '%s ' *)" = "CHANGELOG.md LICENSE THIRD_PARTY_NOTICES-web-ui.txt THIRD_PARTY_NOTICES.md bin "
          grep -q "^## Windows: the libraries from vcpkg" "$stage/THIRD_PARTY_NOTICES.md"
          grep -q "^Hardcharger web UI .*: third-party software notices" "$stage/THIRD_PARTY_NOTICES-web-ui.txt"
          "$stage/bin/hardcharger-server.exe" --version
          "$stage/bin/hardcharger.exe" --version
          "$stage/bin/hardcharger-server.exe" --licenses > "$RUNNER_TEMP/licenses.txt"
          tr -d '\r' < "$RUNNER_TEMP/licenses.txt" > "$RUNNER_TEMP/licenses-lf.txt"
          grep -qx "# Third-party software in Hardcharger" "$RUNNER_TEMP/licenses-lf.txt"
          grep -q "^Hardcharger web UI .*: third-party software notices" "$RUNNER_TEMP/licenses-lf.txt"
          ls -R "$stage"
          (cd dist && 7z a -tzip "hardcharger-${{ matrix.name }}.zip" "hardcharger-${{ matrix.name }}" > /dev/null)
      # The gate is proven to fail: an executable that imports duckdb.dll (linked against
      # an import library made for the purpose) must be refused, by name.
      - name: Prove the import gate fails on a DLL dependency
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: |
          proof="$RUNNER_TEMP/gate-proof"
          mkdir -p "$proof"
          printf 'LIBRARY duckdb\nEXPORTS\n  duckdb_library_version\n' > "$proof/duckdb.def"
          printf 'const char *duckdb_library_version(void);\nint main(void) { return duckdb_library_version()[0]; }\n' > "$proof/probe.c"
          (cd "$proof" && lib -nologo -def:duckdb.def -out:duckdb.lib -machine:${{ matrix.arch }} &&
             cl -nologo probe.c duckdb.lib -Fe:probe.exe)
          if .github/scripts/check-windows-imports.sh "$proof/probe.exe" 2> "$proof/gate.err"; then
            echo "the import gate passed an executable that imports duckdb.dll"; exit 1
          fi
          cat "$proof/gate.err"
          grep -q "imports duckdb.dll" "$proof/gate.err"
      # The README's Windows example, as written there, from a fresh folder.
      - name: Run the zip as the README says
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory smoke | Out-Null
          Copy-Item dist/hardcharger-${{ matrix.name }}.zip smoke/
          Set-Location smoke
          # --- README ---
          Expand-Archive hardcharger-${{ matrix.name }}.zip -DestinationPath .
          $env:HARDCHARGER_ADMIN_PASSWORD = 'change-me'
          # .\hardcharger-${{ matrix.name }}\bin\hardcharger-server.exe --database my.duckdb
          # --- (started in the background here, then probed) ---
          $server = Start-Process -FilePath ".\hardcharger-${{ matrix.name }}\bin\hardcharger-server.exe" `
            -ArgumentList "--database", "my.duckdb" -PassThru -RedirectStandardError server.log
          $up = $false
          foreach ($i in 1..60) {
            try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:31337/warp).StatusCode -eq 200) { $up = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          $token = (Invoke-RestMethod -Method Post -Uri http://127.0.0.1:31337/warp/v1/auth/token `
            -ContentType application/json -Body '{"grant_type":"password","username":"hardcharger","password":"change-me"}').access_token
          # The client in the zip, against it.
          $env:HARDCHARGER_PASSWORD = 'change-me'
          $answer = & ".\hardcharger-${{ matrix.name }}\bin\hardcharger.exe" -h 127.0.0.1 --tls=false -u hardcharger --csv --no-header -c "SELECT 6 * 7"
          Write-Host "client: $answer"
          Stop-Process -Id $server.Id
          Get-Content server.log -Tail 20
          if (-not $up -or -not $token) { throw "the unpacked server did not serve" }
          if ("$answer".Trim() -ne "42") { throw "the unpacked client did not answer 42: $answer" }
          if (-not (Test-Path my.duckdb)) { throw "no database file" }
      # The zip, tested above. With `sign` it goes to the sign job instead, under a name the
      # checksums and the release (pattern hardcharger-*) never pick up; the sign job uploads
      # the signed zip as hardcharger-<platform>.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        with:
          name: ${{ inputs.sign && format('unsigned-{0}', matrix.name) || format('hardcharger-{0}', matrix.name) }}
          path: dist/hardcharger-${{ matrix.name }}.zip
          if-no-files-found: error
      - name: Crash dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-dumps-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/crash-dumps
            server/build/*.exe
            server/build/*.pdb
          if-no-files-found: ignore
          retention-days: 14
      - name: PostgreSQL log
        if: failure()
        run: tail -100 "$(cygpath -u "$RUNNER_TEMP")/pg.log" || true

  # Code signing, with `sign` only: both executables of each zip are signed with GizmoData's
  # code-signing certificate, whose key stays in Azure Key Vault (AzureSignTool signs through
  # the vault), checked, and zipped again under the final name, which the MSI, the checksums
  # and the release then take. As GizmoSQL's sign-windows job. The `production` environment
  # holds the Azure secrets and admits only v* tags and release/* branches; the Azure app
  # trusts this job's OIDC token by the repository's immutable subject (docs/releasing.md).
  # The tests ran on these same executables, unsigned, in the build job: signing appends a
  # signature and changes nothing else, and the zip is checked to differ only there.
  sign:
    name: sign (${{ matrix.name }})
    needs: build
    if: inputs.sign
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
          - name: windows-arm64
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
      id-token: write  # the Azure sign-in (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v8
        with:
          name: unsigned-${{ matrix.name }}
          path: unsigned
      - name: Unpack
        run: |
          7z x -o"dist" "unsigned/hardcharger-${{ matrix.name }}.zip" > /dev/null
          7z x -o"orig" "unsigned/hardcharger-${{ matrix.name }}.zip" > /dev/null
          bin="dist/hardcharger-${{ matrix.name }}/bin"
          test "$(export LC_ALL=C; cd "$bin" && printf '%s ' *)" = "hardcharger-server.exe hardcharger.exe "
          # An unsigned copy, which the signature check must refuse (below).
          cp "$bin/hardcharger.exe" "$(cygpath -u "$RUNNER_TEMP")/unsigned-proof.exe"
      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Install AzureSignTool
        run: dotnet tool install --global AzureSignTool --version 7.0.1
      - name: Sign the executables
        shell: pwsh
        env:
          KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
        run: |
          $bin = "dist/hardcharger-${{ matrix.name }}/bin"
          pwsh -NoProfile -File .github/scripts/azure-sign.ps1 "$bin/hardcharger-server.exe" "$bin/hardcharger.exe"
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
      # The check is proven to fail first: the same executable, unsigned, must be refused as
      # not signed.
      - name: Check the signatures
        shell: pwsh
        run: |
          $bin = "dist/hardcharger-${{ matrix.name }}/bin"
          pwsh -NoProfile -File .github/scripts/verify-windows-signature.ps1 "$env:RUNNER_TEMP/unsigned-proof.exe" *> proof.log
          $refused = $LASTEXITCODE
          Get-Content proof.log
          if ($refused -eq 0) { throw "the signature check passed an unsigned executable" }
          if (-not (Select-String -Quiet -SimpleMatch -Pattern 'signature status NotSigned' -Path proof.log)) {
            throw "the signature check refused the unsigned executable, but not as unsigned"
          }
          pwsh -NoProfile -File .github/scripts/verify-windows-signature.ps1 "$bin/hardcharger-server.exe" "$bin/hardcharger.exe"
          if ($LASTEXITCODE -ne 0) { throw "the signed executables failed the signature check" }
      # Only x64 runs on this runner; server.yml's `verify signatures (windows)` runs both
      # platforms' signed executables on Windows on Arm.
      - name: Run the signed executables
        if: matrix.name == 'windows-amd64'
        run: |
          bin="dist/hardcharger-${{ matrix.name }}/bin"
          "$bin/hardcharger-server.exe" --version
          "$bin/hardcharger.exe" --version
      - name: Zip the signed executables
        run: |
          zip="hardcharger-${{ matrix.name }}.zip"
          (cd dist && 7z a -tzip "$zip" "hardcharger-${{ matrix.name }}" > /dev/null)
          # The same files as the tested zip; only the two executables differ.
          7z x -o"check" "dist/$zip" > /dev/null
          diff <(cd orig && find . -type f | sort) <(cd check && find . -type f | sort)
          diff -r --exclude='*.exe' orig check
          for exe in hardcharger-server.exe hardcharger.exe; do
            if cmp -s "orig/hardcharger-${{ matrix.name }}/bin/$exe" "check/hardcharger-${{ matrix.name }}/bin/$exe"; then
              echo "$exe in the zip is the unsigned one"; exit 1
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: hardcharger-${{ matrix.name }}
          path: dist/hardcharger-${{ matrix.name }}.zip
          if-no-files-found: error

  # An MSI of each zip (WiX 6), from the signed zip when signing (and then signed itself,
  # before the install test runs it).
  msi:
    name: msi (${{ matrix.name }})
    needs: [build, sign]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
          && ((inputs.sign && needs.sign.result == 'success') || (!inputs.sign && needs.sign.result == 'skipped')) }}
    # The environment (its Azure secrets, its tag/branch policy) only when signing.
    environment: ${{ inputs.sign && 'production' || '' }}
    permissions:
      contents: read
      id-token: write  # the Azure sign-in (OIDC), when signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            wix_arch: x64
          - name: windows-arm64
            wix_arch: arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: hardcharger-${{ matrix.name }}
          path: artifacts
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add --global WixToolset.UI.wixext/6.0.2
      - name: Build the MSI
        run: |
          7z x -o"stage" artifacts/hardcharger-${{ matrix.name }}.zip > /dev/null
          # MSI versions are numeric: 2.0.0 for 2.0.0, 2.0.0.1 for 2.0.0-rc.1 (release.sh msi-version).
          full=$(.github/scripts/release.sh version)
          version=$(.github/scripts/release.sh msi-version "$full")
          echo "Hardcharger $full: MSI ProductVersion $version"
          # The license page shows LICENSE as plain text in RTF.
          { printf '{\\rtf1\\ansi\\deff0{\\fonttbl{\\f0 Consolas;}}\\f0\\fs16 '
            sed -e 's/\\/\\\\/g' -e 's/{/\\{/g' -e 's/}/\\}/g' -e 's/$/\\par/' LICENSE
            printf '}'; } > installer/license.rtf
          wix build installer/Hardcharger.wxs -arch ${{ matrix.wix_arch }} -d Version="$version" \
            -bindpath "Stage=$(cygpath -w "$PWD/stage/hardcharger-${{ matrix.name }}")" \
            -bindpath "$(cygpath -w "$PWD/installer")" \
            -ext WixToolset.UI.wixext -o "Hardcharger-${{ matrix.name }}.msi"
          ls -la "Hardcharger-${{ matrix.name }}.msi"
      - uses: azure/login@v3.1.0
        if: inputs.sign
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Install AzureSignTool
        if: inputs.sign
        run: dotnet tool install --global AzureSignTool --version 7.0.1
      - name: Sign the MSI
        if: inputs.sign
        shell: pwsh
        env:
          KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
        run: |
          pwsh -NoProfile -File .github/scripts/azure-sign.ps1 "Hardcharger-${{ matrix.name }}.msi"
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
      # The MSI and the executables it packaged (the signed zip's).
      - name: Check the signatures
        if: inputs.sign
        shell: pwsh
        run: |
          $bin = "stage/hardcharger-${{ matrix.name }}/bin"
          pwsh -NoProfile -File .github/scripts/verify-windows-signature.ps1 "Hardcharger-${{ matrix.name }}.msi" "$bin/hardcharger-server.exe" "$bin/hardcharger.exe"
          if ($LASTEXITCODE -ne 0) { throw "the MSI or its executables failed the signature check" }
      # Installs it (only the x64 one runs on this runner), checks what landed and that
      # the installed server starts, then removes it.
      - name: Install, run and uninstall
        if: matrix.wix_arch == 'x64'
        shell: pwsh
        run: |
          $msi = "Hardcharger-${{ matrix.name }}.msi"
          $p = Start-Process msiexec.exe -ArgumentList "/i", $msi, "/qn", "/l*v", "install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 50; throw "install failed: $($p.ExitCode)" }
          $exe = "$env:ProgramFiles\Hardcharger\bin\hardcharger-server.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "the installed server did not run" }
          if ('${{ inputs.sign }}' -eq 'true') {
            foreach ($installed in $exe, "$env:ProgramFiles\Hardcharger\bin\hardcharger.exe") {
              $status = (Get-AuthenticodeSignature -LiteralPath $installed).Status
              if ($status -ne 'Valid') { throw "the installed $installed is not validly signed: $status" }
            }
          }
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if ($machinePath -notlike "*Hardcharger\bin*") { throw "bin is not on the system PATH" }
          foreach ($doc in "LICENSE", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_NOTICES-web-ui.txt") {
            if (-not (Test-Path "$env:ProgramFiles\Hardcharger\$doc")) { throw "the MSI did not install $doc" }
          }
          if (-not (Select-String -Quiet -Pattern "^## Windows: the libraries from vcpkg" -Path "$env:ProgramFiles\Hardcharger\THIRD_PARTY_NOTICES.md")) {
            throw "the installed THIRD_PARTY_NOTICES.md has no vcpkg section"
          }
          $p = Start-Process msiexec.exe -ArgumentList "/x", $msi, "/qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          if (Test-Path $exe) { throw "uninstall left $exe" }
      - uses: actions/upload-artifact@v7
        with:
          name: hardcharger-${{ matrix.name }}-msi
          path: Hardcharger-${{ matrix.name }}.msi
          if-no-files-found: error

  # The compile-cache warm-up (server.yml's warm-* jobs explain why): the build job's steps up
  # to its sccache save (YAML anchors: same toolset, flags and launcher, the server and
  # warp-duckdb), no tests and no packages, then main's sccache directory saved. One job per
  # platform, since a job's `if` can't see its matrix leg.
  warm-windows-amd64:
    name: warm compile cache (${{ matrix.name }})
    if: contains(inputs.warm, '"windows-amd64"')
    strategy:
      matrix:
        include:
          - *leg-windows-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read  # the tested run's web UI artifact
    env: *build-env
    steps: &warm-steps
      - *build-checkout
      - name: The tested run's web UI
        uses: actions/download-artifact@v8
        with:
          name: hardcharger-ui
          path: server/.web-ui
          run-id: ${{ inputs.tested_run }}
          github-token: ${{ github.token }}
      - *build-ui-tarball
      - *build-submodule
      - *build-msvc
      - *build-toolchain
      - *build-shasum
      - *build-vcpkg-key
      - *build-vcpkg-restore
      - *build-vcpkg-build
      - *build-vcpkg-save
      - *build-dep-arrow
      - *build-dep-replxx
      - *build-dep-duckdb
      - *build-sccache
      - *build-sccache-settings
      - *build-sccache-restore
      - *build-launcher
      - *build-server
      - *build-warp
      # Only after a whole build (a cancelled one would look fresh to the next push), and
      # even when it added nothing: this entry is what tells the next push main is warm.
      - name: sccache directory (save)
        uses: ./.github/actions/sccache-dir
        with:
          mode: save
          name: ${{ matrix.name }}
          toolchain: MSVC ${{ steps.msvc.outputs.version }}
          force: true

  warm-windows-arm64:
    name: warm compile cache (${{ matrix.name }})
    if: contains(inputs.warm, '"windows-arm64"')
    strategy:
      matrix:
        include:
          - *leg-windows-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env: *build-env
    steps: *warm-steps
