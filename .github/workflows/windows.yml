# The Hardcharger server on Windows (x64 and arm64, MSVC): builds the dependencies, the
# server, the client and the Warp SQL reference server, runs the unit tests, the server
# and client suites and the Warp SQL conformance suite (against both servers), and
# packages hardcharger-windows-{amd64,arm64}.zip and an MSI of each. server.yml calls it
# (its `windows` job), on the same events as its other builds; its concurrency is
# server.yml's (a called workflow's own would share the caller's group and cancel it).
name: windows

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            runner: windows-latest
            arch: x64
            test_python: "3.14"
          - name: windows-arm64
            runner: windows-11-arm
            arch: arm64
            # psycopg-binary and pyarrow publish no win_arm64 wheels: the test harnesses run
            # on x64 Python (emulated); the server under test is the native arm64 build.
            test_python: cpython-3.14-windows-x86_64-none
    runs-on: ${{ matrix.runner }}
    env:
      # OpenSSL from vcpkg: static libraries on the static C runtime (/MT), as everything
      # here is built (DuckDB always builds with it on MSVC).
      VCPKG_TRIPLET: ${{ matrix.arch }}-windows-static
      # cl.exe for every CMake project, never a MinGW gcc a runner image puts on PATH.
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@v7
      # The warp-sql submodule is private: fetch it with its read-only deploy key.
      - name: Fetch the warp-sql submodule
        env:
          DEPLOY_KEY: ${{ secrets.WARP_SQL_DEPLOY_KEY }}
        run: |
          key="$(cygpath -u "$RUNNER_TEMP")/warp_sql_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git submodule update --init --depth 1
          rm -f "$key"

      # Passes the architecture to vcvarsall (arm64 on the arm64 runner selects the native
      # ARM64-hosted toolchain). Its environment reaches the bash steps too.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      # Every cache below is keyed on the exact MSVC toolset: cached CMake trees record
      # the compiler's absolute path, so a runner image with another toolset must build
      # cold rather than fail at configure.
      - name: Toolchain
        id: msvc
        run: |
          [ -n "$VCToolsVersion" ] || { echo "VCToolsVersion is not set: did msvc-dev-cmd run?"; exit 1; }
          echo "version=$VCToolsVersion" >> "$GITHUB_OUTPUT"
          echo "MSVC $VCToolsVersion ($VCToolsInstallDir)"
          # vcvarsall points VCPKG_ROOT at Visual Studio's own copy; use the runner's.
          echo "VCPKG_ROOT=C:\\vcpkg" >> "$GITHUB_ENV"
          cmake --version | head -1
          ninja --version

      # Git for Windows has sha256sum but no shasum, which server/scripts/ci-deps-key.sh
      # (the dependency caches' keys) calls as `shasum -a 256`.
      - name: shasum
        run: |
          bin="$(cygpath -u "$RUNNER_TEMP")/bin"
          mkdir -p "$bin"
          printf '#!/usr/bin/env bash\n[ "${1:-}" = -a ] && shift 2\nexec sha256sum "$@"\n' > "$bin/shasum"
          chmod +x "$bin/shasum"
          cygpath -w "$bin" >> "$GITHUB_PATH"
          echo abc | "$bin/shasum" -a 256

      # The Windows libraries vcpkg builds (static, on the static C runtime), listed in
      # .github/windows-vcpkg-packages.txt: OpenSSL for everything, and libpq, libcurl and
      # CRoaring for DuckDB's built-in extensions (the postgres scanner, httpfs, ducklake).
      - name: vcpkg libraries cache key
        id: vcpkg
        run: |
          commit=$(git -C /c/vcpkg rev-parse --short=12 HEAD)
          list=$(sha256sum .github/windows-vcpkg-packages.txt | cut -c1-12)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "key=vcpkg-${VCPKG_TRIPLET}-msvc${{ steps.msvc.outputs.version }}-$commit-$list" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: vcpkg-cache
        with:
          path: C:\vcpkg\installed
          key: ${{ steps.vcpkg.outputs.key }}
      - name: Build the vcpkg libraries
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          # (The checkout has Windows line ends.)
          mapfile -t packages < <(tr -d '\r' < .github/windows-vcpkg-packages.txt)
          /c/vcpkg/vcpkg.exe install "${packages[@]/%/:$VCPKG_TRIPLET}" --clean-after-build
      - uses: actions/cache/save@v6
        if: steps.vcpkg-cache.outputs.cache-hit != 'true' && !startsWith(github.ref, 'refs/tags/')
        with:
          path: C:\vcpkg\installed
          key: ${{ steps.vcpkg.outputs.key }}

      # Arrow, replxx and DuckDB: one cache each (.github/actions/dep-cache, as on the other
      # platforms), keyed on the dependency's own recipes, server/scripts/windows-deps.sh's
      # Windows part and the MSVC toolset (DuckDB's also on vcpkg's libraries), so a change
      # to one never rebuilds another. DuckDB takes 35-70 minutes cold.
      - name: Arrow (cached)
        uses: ./.github/actions/dep-cache
        with:
          dependency: arrow
          platform: ${{ matrix.name }}
          toolchain: MSVC ${{ steps.msvc.outputs.version }}
          extra-recipes: server/scripts/windows-deps.sh .github/cmake/msvc-static-crt.cmake
          build: server/scripts/windows-deps.sh
      - name: replxx (cached)
        uses: ./.github/actions/dep-cache
        with:
          dependency: replxx
          platform: ${{ matrix.name }}
          toolchain: MSVC ${{ steps.msvc.outputs.version }}
          extra-recipes: server/scripts/windows-deps.sh .github/cmake/msvc-static-crt.cmake
          build: server/scripts/windows-deps.sh
      - name: DuckDB (cached)
        uses: ./.github/actions/dep-cache
        with:
          dependency: duckdb
          platform: ${{ matrix.name }}
          toolchain: MSVC ${{ steps.msvc.outputs.version }} vcpkg ${{ steps.vcpkg.outputs.commit }}
          extra-recipes: >-
            server/scripts/windows-deps.sh server/scripts/deps-duckdb-windows.sh
            .github/cmake/windows-vcpkg.cmake .github/cmake/msvc-static-crt.cmake
            .github/windows-vcpkg-packages.txt
          build: server/scripts/windows-deps.sh

      - name: Build the server
        id: server
        run: |
          start=$SECONDS
          openssl="/c/vcpkg/installed/$VCPKG_TRIPLET"
          # vcpkg's toolchain (windows-vcpkg.cmake) finds the libraries DuckDB's built-in
          # extensions link, as DuckDB's own build did.
          cmake -S server -B server/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="$(cygpath -m "$PWD/.github/cmake/windows-vcpkg.cmake")" \
                -DOPENSSL_ROOT_DIR="$(cygpath -m "$openssl")" -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE
          cmake --build server/build
          server/build/hardcharger-server.exe --version
          server/build/hardcharger-server.exe --print-duckdb-version
          echo "server built in $(( SECONDS - start )) s"
      # The Warp SQL reference server (warp-sql has no CI of its own), on the same deps.
      - name: Build warp-duckdb
        id: warp
        run: |
          openssl="/c/vcpkg/installed/$VCPKG_TRIPLET"
          deps="$(cygpath -m "$PWD/server/.deps")"
          cmake -S third_party/warp-sql/cpp -B build-warp -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="$(cygpath -m "$PWD/.github/cmake/windows-vcpkg.cmake")" \
                -DOPENSSL_ROOT_DIR="$(cygpath -m "$openssl")" -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE \
                -DWARPSQL_ARROW_PREFIX="$deps/arrow-install" -DWARPSQL_DUCKDB_PREFIX="$deps/duckdb-install" \
                -DWARPSQL_BUILD_TESTS=ON
          cmake --build build-warp --target warp-duckdb warpsql-client-tests warpsql-sdk-tests

      - name: Unit tests
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: server/build/hardcharger-unit-tests.exe --gtest_brief=1
      # The Warp SQL client library's own tests (unit, and live against warp-duckdb).
      - name: Client library tests
        if: ${{ !cancelled() && steps.warp.outcome == 'success' }}
        run: build-warp/warpsql-client-tests.exe --gtest_brief=1
      # The SDK's own unit tests (the security-event limiter).
      - name: SDK unit tests
        if: ${{ !cancelled() && steps.warp.outcome == 'success' }}
        run: build-warp/warpsql-sdk-tests.exe --gtest_brief=1

      # PostgreSQL for the access-control grant store (the tests fail without it). The
      # x64 image ships PostgreSQL; elsewhere EnterpriseDB's x64 binaries (emulated on arm64).
      - name: Start PostgreSQL
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: |
          pgbin=""
          for dir in "${PGBIN:-}" /c/Program\ Files/PostgreSQL/*/bin; do
            if [ -n "$dir" ] && [ -x "$dir/initdb.exe" ]; then pgbin="$dir"; fi
          done
          if [ -z "$pgbin" ]; then
            curl -sSfL -o "$RUNNER_TEMP/pg.zip" https://get.enterprisedb.com/postgresql/postgresql-17.6-1-windows-x64-binaries.zip
            pwsh -NoProfile -Command "Expand-Archive -Path '$RUNNER_TEMP/pg.zip' -DestinationPath '$RUNNER_TEMP/pg-bin'"
            pgbin="$(cygpath -u "$RUNNER_TEMP")/pg-bin/pgsql/bin"
          fi
          echo "PostgreSQL from $pgbin"
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          # Passwords are checked, as in the Linux jobs' container.
          printf 'hardcharger\n' > "$tmp/pgpass"
          "$pgbin/initdb.exe" -D "$tmp/pg" -U hardcharger --auth=scram-sha-256 --pwfile="$tmp/pgpass" -E UTF8
          "$pgbin/pg_ctl.exe" -D "$tmp/pg" -o "-p 55433" -l "$tmp/pg.log" -w start
          PGPASSWORD=hardcharger "$pgbin/createdb.exe" -h 127.0.0.1 -p 55433 -U hardcharger hardcharger

      # Its cache key from the two test projects only: scanning the whole workspace for
      # lock files once failed on a file in a build tree (EPERM).
      - uses: astral-sh/setup-uv@v10.3.0
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        with:
          cache-dependency-glob: |
            server/tests/pyproject.toml
            third_party/warp-sql/conformance/pyproject.toml
      # Everything, access control and the client included, on the one build, the one that
      # ships. Deselected by marker, visibly: the DuckLake suites (Docker's PostgreSQL and
      # S3 containers, which Windows runners can't run; as on macOS) and the client's
      # cases at a terminal (pexpect.spawn needs a pty, which Windows lacks).
      - name: Hardcharger tests
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        working-directory: server/tests
        env:
          PYTHONUTF8: "1"  # the servers and the client write UTF-8, not the ANSI code page
        run: |
          uv venv .venv --python ${{ matrix.test_python }}
          uv pip install --python .venv/Scripts/python.exe -r pyproject.toml
          # In parallel (pytest-xdist, as server.yml), then the `serial` tests alone.
          .venv/Scripts/python.exe -m pytest -q -rfE -n 4 -m "not serial and not services and not pty" --durations=10
          .venv/Scripts/python.exe -m pytest -q -rfE -m "serial and not services and not pty" --durations=5
      - name: Warp SQL conformance suite (Hardcharger)
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        working-directory: third_party/warp-sql/conformance
        env:
          WARP_SQL_TEST_SERVER_PASSWORD_ENV: HARDCHARGER_ADMIN_PASSWORD
          WARP_SQL_TEST_SERVER_USERNAME: warp
          WARP_SQL_TEST_SERVER_IDLE_FLAG: --session-idle-timeout
          # The flag naming the client CA in the mutual-TLS tests (test_mtls.py).
          WARP_SQL_TEST_SERVER_MTLS_FLAG: --mtls-ca-cert
          HARDCHARGER_ADMIN_USERNAME: warp
          HARDCHARGER_PRINT_QUERIES: "false"
        run: |
          uv venv .venv --python ${{ matrix.test_python }}
          uv pip install --python .venv/Scripts/python.exe -e .
          WARP_SQL_TEST_SERVER_BINARY="$(cygpath -m "$GITHUB_WORKSPACE/server/build/hardcharger-server.exe")" \
            .venv/Scripts/python.exe -m pytest -q -rfE
      - name: Warp SQL conformance suite (warp-duckdb)
        if: ${{ !cancelled() && steps.warp.outcome == 'success' }}
        working-directory: third_party/warp-sql/conformance
        run: |
          WARP_SQL_TEST_SERVER_BINARY="$(cygpath -m "$GITHUB_WORKSPACE/build-warp/warp-duckdb.exe")" \
            .venv/Scripts/python.exe -m pytest -q -rfE

      # An investigation, run when the head commit's message says [stream-repro]: the
      # conformance case for a statement that fails mid-stream, 200 times against each
      # server (a clean end there would hand over a truncated result as complete).
      - name: Mid-stream failure, 200 times
        if: ${{ !cancelled() && steps.warp.outcome == 'success' && contains(github.event.head_commit.message, '[stream-repro]') }}
        working-directory: third_party/warp-sql/conformance
        env:
          PYTHONUTF8: "1"
          HARDCHARGER_ADMIN_USERNAME: warp
          HARDCHARGER_PRINT_QUERIES: "false"
        run: |
          uv pip install --python .venv/Scripts/python.exe pytest-repeat
          case_id="tests/test_results.py::test_failure_mid_stream_leaves_the_stream_incomplete"
          status=0
          echo "== Hardcharger"
          WARP_SQL_TEST_SERVER_BINARY="$(cygpath -m "$GITHUB_WORKSPACE/server/build/hardcharger-server.exe")" \
          WARP_SQL_TEST_SERVER_PASSWORD_ENV=HARDCHARGER_ADMIN_PASSWORD WARP_SQL_TEST_SERVER_USERNAME=warp \
          WARP_SQL_TEST_SERVER_LOG="$RUNNER_TEMP/repro-hardcharger.log" \
            .venv/Scripts/python.exe -m pytest -q -rfE --count 200 "$case_id" || status=1
          echo "== warp-duckdb"
          WARP_SQL_TEST_SERVER_BINARY="$(cygpath -m "$GITHUB_WORKSPACE/build-warp/warp-duckdb.exe")" \
          WARP_SQL_TEST_SERVER_LOG="$RUNNER_TEMP/repro-warp-duckdb.log" \
            .venv/Scripts/python.exe -m pytest -q -rfE --count 200 "$case_id" || status=1
          exit $status

      # The same layout as the other platforms' tarballs: bin/ (the server and the client,
      # single-file executables: every dependency and the C++ runtime linked in), LICENSE
      # and CHANGELOG.md. The import gate fails on any DLL but Windows' own.
      - name: Package
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: |
          stage="dist/hardcharger-${{ matrix.name }}"
          cmake --install server/build --prefix "$stage"
          # The server and the client ship, nothing else (never the tests, never a DLL).
          test "$(ls "$stage/bin" | tr '\n' ' ')" = "hardcharger-server.exe hardcharger.exe "
          .github/scripts/check-windows-imports.sh "$stage/bin/hardcharger-server.exe" "$stage/bin/hardcharger.exe"
          cp LICENSE CHANGELOG.md "$stage/"
          "$stage/bin/hardcharger-server.exe" --version
          "$stage/bin/hardcharger.exe" --version
          ls -R "$stage"
          (cd dist && 7z a -tzip "hardcharger-${{ matrix.name }}.zip" "hardcharger-${{ matrix.name }}" > /dev/null)
      # The gate is proven to fail: an executable that imports duckdb.dll (linked against
      # an import library made for the purpose) must be refused, by name.
      - name: Prove the import gate fails on a DLL dependency
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: |
          proof="$RUNNER_TEMP/gate-proof"
          mkdir -p "$proof"
          printf 'LIBRARY duckdb\nEXPORTS\n  duckdb_library_version\n' > "$proof/duckdb.def"
          printf 'const char *duckdb_library_version(void);\nint main(void) { return duckdb_library_version()[0]; }\n' > "$proof/probe.c"
          (cd "$proof" && lib -nologo -def:duckdb.def -out:duckdb.lib -machine:${{ matrix.arch }} &&
             cl -nologo probe.c duckdb.lib -Fe:probe.exe)
          if .github/scripts/check-windows-imports.sh "$proof/probe.exe" 2> "$proof/gate.err"; then
            echo "the import gate passed an executable that imports duckdb.dll"; exit 1
          fi
          cat "$proof/gate.err"
          grep -q "imports duckdb.dll" "$proof/gate.err"
      # The README's Windows example, as written there, from a fresh folder.
      - name: Run the zip as the README says
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory smoke | Out-Null
          Copy-Item dist/hardcharger-${{ matrix.name }}.zip smoke/
          Set-Location smoke
          # --- README ---
          Expand-Archive hardcharger-${{ matrix.name }}.zip -DestinationPath .
          $env:HARDCHARGER_ADMIN_PASSWORD = 'change-me'
          # .\hardcharger-${{ matrix.name }}\bin\hardcharger-server.exe --database my.duckdb
          # --- (started in the background here, then probed) ---
          $server = Start-Process -FilePath ".\hardcharger-${{ matrix.name }}\bin\hardcharger-server.exe" `
            -ArgumentList "--database", "my.duckdb" -PassThru -RedirectStandardError server.log
          $up = $false
          foreach ($i in 1..60) {
            try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:31337/warp).StatusCode -eq 200) { $up = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          $token = (Invoke-RestMethod -Method Post -Uri http://127.0.0.1:31337/warp/v1/auth/token `
            -ContentType application/json -Body '{"grant_type":"password","username":"hardcharger","password":"change-me"}').access_token
          # The client in the zip, against it.
          $env:HARDCHARGER_PASSWORD = 'change-me'
          $answer = & ".\hardcharger-${{ matrix.name }}\bin\hardcharger.exe" -h 127.0.0.1 -u hardcharger --csv --no-header -c "SELECT 6 * 7"
          Write-Host "client: $answer"
          Stop-Process -Id $server.Id
          Get-Content server.log -Tail 20
          if (-not $up -or -not $token) { throw "the unpacked server did not serve" }
          if ("$answer".Trim() -ne "42") { throw "the unpacked client did not answer 42: $answer" }
          if (-not (Test-Path my.duckdb)) { throw "no database file" }
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        with:
          name: hardcharger-${{ matrix.name }}
          path: dist/hardcharger-${{ matrix.name }}.zip
          if-no-files-found: error
      - name: PostgreSQL log
        if: failure()
        run: tail -100 "$(cygpath -u "$RUNNER_TEMP")/pg.log" || true

  # An MSI of each zip (WiX 6). Unsigned: the code-signing certificate is a follow-up.
  msi:
    name: msi (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            wix_arch: x64
          - name: windows-arm64
            wix_arch: arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: hardcharger-${{ matrix.name }}
          path: artifacts
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add --global WixToolset.UI.wixext/6.0.2
      - name: Build the MSI
        run: |
          7z x -o"stage" artifacts/hardcharger-${{ matrix.name }}.zip > /dev/null
          version=$(sed -n 's/^project(hardcharger VERSION \([0-9.]*\).*/\1/p' server/CMakeLists.txt)
          [ -n "$version" ] || { echo "no version in server/CMakeLists.txt"; exit 1; }
          # The license page shows LICENSE as plain text in RTF.
          { printf '{\\rtf1\\ansi\\deff0{\\fonttbl{\\f0 Consolas;}}\\f0\\fs16 '
            sed -e 's/\\/\\\\/g' -e 's/{/\\{/g' -e 's/}/\\}/g' -e 's/$/\\par/' LICENSE
            printf '}'; } > installer/license.rtf
          wix build installer/Hardcharger.wxs -arch ${{ matrix.wix_arch }} -d Version="$version" \
            -bindpath "Stage=$(cygpath -w "$PWD/stage/hardcharger-${{ matrix.name }}")" \
            -bindpath "$(cygpath -w "$PWD/installer")" \
            -ext WixToolset.UI.wixext -o "Hardcharger-${{ matrix.name }}.msi"
          ls -la "Hardcharger-${{ matrix.name }}.msi"
      # Installs it (only the x64 one runs on this runner), checks what landed and that
      # the installed server starts, then removes it.
      - name: Install, run and uninstall
        if: matrix.wix_arch == 'x64'
        shell: pwsh
        run: |
          $msi = "Hardcharger-${{ matrix.name }}.msi"
          $p = Start-Process msiexec.exe -ArgumentList "/i", $msi, "/qn", "/l*v", "install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 50; throw "install failed: $($p.ExitCode)" }
          $exe = "$env:ProgramFiles\Hardcharger\bin\hardcharger-server.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "the installed server did not run" }
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if ($machinePath -notlike "*Hardcharger\bin*") { throw "bin is not on the system PATH" }
          $p = Start-Process msiexec.exe -ArgumentList "/x", $msi, "/qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          if (Test-Path $exe) { throw "uninstall left $exe" }
      - uses: actions/upload-artifact@v7
        with:
          name: hardcharger-${{ matrix.name }}-msi
          path: Hardcharger-${{ matrix.name }}.msi
          if-no-files-found: error
