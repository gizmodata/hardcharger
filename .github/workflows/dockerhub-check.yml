name: dockerhub-check

# Run by hand: proves the release can sign in to Docker Hub by OIDC, without pushing anything.
on:
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same branch makes an older one pointless: cancel it. Never on a tag:
# a release run must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write  # Docker Hub's OIDC sign-in
    steps:
      # What Docker Hub's trust rules see: the claims of this run's OIDC token (never the token).
      - name: OIDC claims
        run: |
          token=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$token"
          payload=$(cut -d. -f2 <<< "$token" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          base64 -d <<< "$payload" | jq '{sub, aud, repository, repository_owner, ref, ref_type, event_name, workflow_ref, job_workflow_ref, environment}'
      - uses: docker/login-action@v4
        env:
          DOCKERHUB_OIDC_CONNECTIONID: 07b8e4b3-1db1-46b5-a5e1-7d2fff417c60
        with:
          registry: docker.io
          username: gizmodata
      - name: Signed in, the repository is reachable
        run: docker manifest inspect docker.io/gizmodata/hardcharger:latest >/dev/null 2>&1 && echo "latest exists" || echo "no latest tag yet (expected before the first release)"
