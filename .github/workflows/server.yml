# The Hardcharger server: builds and tests on every push and pull request; on a v* tag,
# also publishes the container image (ghcr.io, private) and the GitHub Release. The
# tests run on the tagged commit itself, in this workflow, before anything is published.
name: server

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["python/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # The warp-sql submodule is private: fetch it with its read-only deploy key (the
      # key reaches only that repository, so the main checkout uses the usual token).
      - name: Fetch the warp-sql submodule
        env:
          DEPLOY_KEY: ${{ secrets.WARP_SQL_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/warp_sql_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git submodule update --init --depth 1
          rm -f "$key"

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      # DuckDB and Arrow take a while to build; cache them by their pins and by the
      # compiler, so a runner image's toolchain change rebuilds instead of breaking.
      - name: Dependency cache key
        id: deps
        run: |
          pins=$(cat third_party/warp-sql/cpp/scripts/build-duckdb.sh third_party/warp-sql/cpp/scripts/build-arrow.sh \
                     server/scripts/build-deps.sh server/scripts/patch-duckdb.cmake | shasum -a 256 | cut -c1-16)
          compiler=$(c++ --version | head -1 | shasum -a 256 | cut -c1-12)
          echo "key=deps-${{ matrix.name }}-$pins-$compiler" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: cache
        with:
          path: |
            server/.deps/duckdb-install
            server/.deps/arrow-install
          key: ${{ steps.deps.outputs.key }}
      - name: Build DuckDB and Arrow
        if: steps.cache.outputs.cache-hit != 'true'
        run: server/scripts/build-deps.sh

      - name: Build the server
        run: |
          cmake -S server -B server/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build server/build
          server/build/hardcharger --version
          server/build/hardcharger --print-duckdb-version
          # The release binary never trusts the tests' license key.
          if server/build/hardcharger --version | grep -q "test-license"; then exit 1; fi
      # The access-control tests run on a build that trusts the tests' license key
      # (there is no GizmoData license in CI); it is never packaged.
      - name: Build the test-license server
        run: |
          cmake -S server -B server/build-test -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DHARDCHARGER_TRUST_TEST_LICENSES=ON
          cmake --build server/build-test
          server/build-test/hardcharger --version | grep -q "test-license"

      # PostgreSQL for the access-control grant store (the tests fail without it).
      - name: Start PostgreSQL (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name hardcharger-test-pg -e POSTGRES_USER=hardcharger \
            -e POSTGRES_PASSWORD=hardcharger -e POSTGRES_DB=hardcharger \
            -p 127.0.0.1:55433:5432 postgres:17-alpine
          for _ in $(seq 1 30); do docker exec hardcharger-test-pg pg_isready -U hardcharger && break; sleep 1; done
      - name: Start PostgreSQL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@17
          pg="$(brew --prefix postgresql@17)/bin"
          # Passwords are checked, as in the Linux jobs' container: a test signs in with a
          # wrong one and expects to be refused.
          printf 'hardcharger\n' > "$RUNNER_TEMP/pgpass"
          "$pg/initdb" -D "$RUNNER_TEMP/pg" -U hardcharger --auth=scram-sha-256 --pwfile="$RUNNER_TEMP/pgpass"
          "$pg/pg_ctl" -D "$RUNNER_TEMP/pg" -o "-p 55433 -k $RUNNER_TEMP" -l "$RUNNER_TEMP/pg.log" -w start
          PGPASSWORD=hardcharger "$pg/createdb" -h 127.0.0.1 -p 55433 -U hardcharger hardcharger

      - uses: astral-sh/setup-uv@v10.3.0
      # PostgreSQL and an S3 gateway for the DuckLake suites (Docker runs on the Linux
      # runners only; the macOS job deselects those suites by marker, visibly).
      - name: Test services
        if: runner.os == 'Linux'
        run: docker compose -f server/tests/docker-compose.yml up -d --wait
      - name: Hardcharger tests
        working-directory: server/tests
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -r pyproject.toml
          # Everything, access control included, on the test-license build (the DuckLake
          # suites need Docker, which only the Linux runners have; macOS deselects them by
          # marker, visibly)...
          markers=()
          if [ "$RUNNER_OS" != "Linux" ]; then markers=(-m "not services"); fi
          HARDCHARGER_TEST_BINARY=../build-test/hardcharger HARDCHARGER_TEST_UNIT_BINARY=../build-test/hardcharger-unit-tests \
            .venv/bin/python -m pytest -q "${markers[@]}"
          # ...and the suites that need no license on the binary that ships.
          .venv/bin/python -m pytest -q test_server.py
      - name: Warp SQL conformance suite
        working-directory: third_party/warp-sql/conformance
        env:
          WARP_SQL_TEST_SERVER_BINARY: ${{ github.workspace }}/server/build/hardcharger
          WARP_SQL_TEST_SERVER_PASSWORD_ENV: HARDCHARGER_PASSWORD
          WARP_SQL_TEST_SERVER_USERNAME: warp
          HARDCHARGER_USERNAME: warp
          HARDCHARGER_PRINT_QUERIES: "false"
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -e .
          .venv/bin/python -m pytest -q

      - name: Package
        run: |
          stage="dist/hardcharger-${{ matrix.name }}"
          cmake --install server/build --prefix "$stage"
          # Only the release server ships: never the unit tests, and never a build that
          # trusts the tests' license key.
          test "$(ls "$stage/bin")" = "hardcharger"
          if "$stage/bin/hardcharger" --version | grep -q "test-license"; then exit 1; fi
          mkdir -p "$stage/lib"
          cp -P server/.deps/duckdb-install/lib/libduckdb.* "$stage/lib/"
          cp LICENSE CHANGELOG.md "$stage/"
          "$stage/bin/hardcharger" --version
          tar -C dist -czf "dist/hardcharger-${{ matrix.name }}.tar.gz" "hardcharger-${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: hardcharger-${{ matrix.name }}
          path: dist/hardcharger-${{ matrix.name }}.tar.gz

  # The server and the Warp SQL conformance suite again, on an AddressSanitizer build: a
  # use-after-free that only crashed now and then (borrowed DuckDB handles destroyed) fails
  # here every time. The suites fail when the server dies or exits non-zero.
  sanitize:
    name: address sanitizer (linux-amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the warp-sql submodule
        env:
          DEPLOY_KEY: ${{ secrets.WARP_SQL_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/warp_sql_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git submodule update --init --depth 1
          rm -f "$key"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev
      # The same dependency cache as the linux-amd64 build (same key).
      - name: Dependency cache key
        id: deps
        run: |
          pins=$(cat third_party/warp-sql/cpp/scripts/build-duckdb.sh third_party/warp-sql/cpp/scripts/build-arrow.sh \
                     server/scripts/build-deps.sh server/scripts/patch-duckdb.cmake | shasum -a 256 | cut -c1-16)
          compiler=$(c++ --version | head -1 | shasum -a 256 | cut -c1-12)
          echo "key=deps-linux-amd64-$pins-$compiler" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: cache
        with:
          path: |
            server/.deps/duckdb-install
            server/.deps/arrow-install
          key: ${{ steps.deps.outputs.key }}
      - name: Build DuckDB and Arrow
        if: steps.cache.outputs.cache-hit != 'true'
        run: server/scripts/build-deps.sh
      # A test-license build, so the access-control suites run under the sanitizer too.
      - name: Build the server with AddressSanitizer
        run: |
          cmake -S server -B server/build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DHARDCHARGER_TRUST_TEST_LICENSES=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          cmake --build server/build-asan
      - name: Start PostgreSQL
        run: |
          docker run -d --name hardcharger-test-pg -e POSTGRES_USER=hardcharger \
            -e POSTGRES_PASSWORD=hardcharger -e POSTGRES_DB=hardcharger \
            -p 127.0.0.1:55433:5432 postgres:17-alpine
          for _ in $(seq 1 30); do docker exec hardcharger-test-pg pg_isready -U hardcharger && break; sleep 1; done
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Test services
        run: docker compose -f server/tests/docker-compose.yml up -d --wait
      - name: Hardcharger tests (ASan)
        working-directory: server/tests
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          HARDCHARGER_TEST_BINARY: ${{ github.workspace }}/server/build-asan/hardcharger
          HARDCHARGER_TEST_UNIT_BINARY: ${{ github.workspace }}/server/build-asan/hardcharger-unit-tests
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -r pyproject.toml
          # The release build (which this job doesn't build) is checked in the build job.
          .venv/bin/python -m pytest -q \
            --deselect test_inline_license_key.py::test_shipped_binary_refuses_test_signed_keys
      - name: Warp SQL conformance suite (ASan)
        working-directory: third_party/warp-sql/conformance
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          WARP_SQL_TEST_SERVER_BINARY: ${{ github.workspace }}/server/build-asan/hardcharger
          WARP_SQL_TEST_SERVER_PASSWORD_ENV: HARDCHARGER_PASSWORD
          WARP_SQL_TEST_SERVER_USERNAME: warp
          WARP_SQL_TEST_SERVER_LOG: ${{ runner.temp }}/conformance-server.log
          HARDCHARGER_USERNAME: warp
          HARDCHARGER_PRINT_QUERIES: "false"
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -e .
          .venv/bin/python -m pytest -q
      - name: Server log
        if: failure()
        run: tail -200 "$RUNNER_TEMP/conformance-server.log" || true

  image:
    needs: [build, sanitize]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: hardcharger-linux-*
          path: artifacts
          merge-multiple: true
      - name: Unpack
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            tar -C dist -xzf "artifacts/hardcharger-linux-$arch.tar.gz"
          done
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and on a tag, push) the image
        run: |
          tags="--tag ghcr.io/gizmodata/hardcharger:dev"
          push=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags="--tag ghcr.io/gizmodata/hardcharger:$version --tag ghcr.io/gizmodata/hardcharger:latest"
            push="--push"
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --file docker/Dockerfile $tags $push .
      - name: Smoke-test the image
        run: |
          docker buildx build --platform linux/amd64 --file docker/Dockerfile --tag hc-smoke --load .
          docker run --rm hc-smoke --version
          docker run -d --name hc -e HARDCHARGER_PASSWORD=smoke -p 31337:31337 -p 31338:31338 hc-smoke
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:31338/health && break; sleep 1; done
          curl -sf http://127.0.0.1:31337/warp
          docker logs hc
          docker rm -f hc

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sanitize, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: hardcharger-*
          path: dist
          merge-multiple: true
      - name: Check the tag matches the server version
        run: |
          version=$(sed -n 's/^project(hardcharger VERSION \([0-9.]*\).*/\1/p' server/CMakeLists.txt)
          [ -n "$version" ] || { echo "no version in server/CMakeLists.txt"; exit 1; }
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Extract this version's CHANGELOG section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "no CHANGELOG section for $version"; exit 1; }
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/*
