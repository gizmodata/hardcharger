# Temporary Android-only proof; never merge this workflow into the release.
name: server
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        abi:
        - x86_64
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      HARDCHARGER_ANDROID_BUILD_NUMBER: '1'
    steps:
    - uses: actions/checkout@v7
    - run: git submodule update --init --depth 1
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - run: 'sudo apt-get update

        sudo apt-get install -y ninja-build cmake bison flex libperl-dev

        sdkmanager ''platforms;android-36'' ''build-tools;36.0.0'' ''ndk;28.2.13676358''

        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

        '
    - uses: actions/download-artifact@v8
      if: ${{ !inputs.warm_cache }}
      with:
        name: hardcharger-ui
        path: ui/release
        run-id: 44804271759
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/cache@v5
      id: deps
      with:
        path: android/build/${{ matrix.abi }}/deps/*-install
        key: android-linux-ndk28.2-${{ matrix.abi }}-${{ hashFiles('android/cmake/**', 'android/scripts/build-native.sh',
          'server/scripts/*.sh', 'server/scripts/*.cmake', 'third_party/chargewire/cpp/scripts/*.sh') }}
    - name: Warm dependency caches on main
      if: inputs.warm_cache && steps.deps.outputs.cache-hit != 'true'
      env:
        HARDCHARGER_ANDROID_DEPS_ONLY: '1'
        ABI: ${{ matrix.abi }}
      run: android/scripts/build-native.sh "$ABI" play
    - name: Build and check the Play distribution
      if: ${{ !inputs.warm_cache }}
      env:
        ABI: ${{ matrix.abi }}
      run: 'python3 server/scripts/third-party-notices.py --check

        android/scripts/build-native.sh "$ABI" play

        android/gradlew -p android -PhardchargerDistribution=play -PhardchargerSignReleaseForTesting=true :app:testReleaseUnitTest
        :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :release-tests:assembleRelease

        mkdir -p android/build/ci/play android/build/ci/release

        cp android/build/app-play/outputs/apk/debug/app-debug.apk android/build/ci/play/app.apk

        cp android/build/app-play/outputs/apk/release/app-release.apk android/build/ci/release/app.apk

        cp android/release-tests/build/outputs/apk/release/release-tests-release.apk android/build/ci/release/test.apk

        cp android/build/app-play/outputs/apk/androidTest/debug/app-debug-androidTest.apk android/build/ci/play/test.apk

        '
    - name: Build the regular local distribution for regression tests
      if: matrix.abi == 'x86_64' && !inputs.warm_cache
      run: 'android/scripts/build-native.sh x86_64 local

        android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest

        mkdir -p android/build/ci/local

        cp android/app/build/outputs/apk/debug/app-debug.apk android/build/ci/local/app.apk

        cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk android/build/ci/local/test.apk

        '
    - name: Enable KVM
      if: matrix.abi == 'x86_64' && !inputs.warm_cache
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Full Android suites and console viewport proof
      if: matrix.abi == 'x86_64' && !inputs.warm_cache
      uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
      with:
        api-level: 36
        arch: x86_64
        target: google_apis
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
        script: 'bash android/scripts/ci-instrumentation.sh

          bash android/scripts/ci-release-tests.sh

          bash android/scripts/console-viewport-proof.sh'
    - uses: actions/upload-artifact@v7
      if: ${{ !inputs.warm_cache }}
      with:
        name: android-native-${{ matrix.abi }}
        path: android/app/src/play/jniLibs/
        if-no-files-found: error
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: android-checks-${{ matrix.abi }}
        path: 'android/build/app-play/reports/

          android/build/ci/*.txt

          android/build/ci/release-evidence/

          '
        if-no-files-found: ignore
