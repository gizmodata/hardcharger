# Temporary baseline-only proof; never merge this workflow into the release.
name: server
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
env:
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 2G
  HARDCHARGER_TEST_XDIST_WORKERS: '6'
jobs:
  build:
    name: build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: linux-amd64-baseline
          runner: ubuntu-24.04
          manylinux: quay.io/pypa/manylinux_2_28_x86_64:2026.10.10-1@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae
          cpu_target: baseline
    runs-on: ${{ matrix.runner }}
    env:
      HARDCHARGER_MANYLINUX_IMAGE: ${{ matrix.manylinux }}
      HARDCHARGER_CPU_TARGET: ${{ matrix.cpu_target }}
      HARDCHARGER_TEST_BASELINE_BUILD: ${{ matrix.cpu_target == 'baseline' && '1' || '0' }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: hardcharger-ui
        path: server/.web-ui
        run-id: 44804271759
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: The web UI tarball
      run: 'shopt -s nullglob

        ui=("$PWD"/server/.web-ui/hardcharger-ui-*.tar.gz)

        [ ${#ui[@]} -eq 1 ] || { echo "expected one hardcharger-ui tarball, found: ${ui[*]}"; exit 1; }

        echo "HARDCHARGER_UI_TARBALL=${ui[0]}" >> "$GITHUB_ENV"

        '
    - name: Fetch the chargewire submodule
      run: git submodule update --init --depth 1
    - name: Third-party notices are in step with the recipes
      run: python3 server/scripts/third-party-notices.py --check
    - name: Install build tools (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja
    - name: Toolchain
      id: toolchain
      run: "if [ \"$RUNNER_OS\" = macOS ]; then\n  clang=$(clang --version | head -1 | sed -nE 's/.*\\((clang-[0-9.]+)\\).*/\\\
        1/p')\n  [ -n \"$clang\" ] || { echo \"no clang build in: $(clang --version)\"; exit 1; }\n  toolchain=\"$(xcodebuild\
        \ -version | tr '\\n' ' ') $clang\"\n  build=\"server/scripts/build-deps.sh\"\n  # DuckDB's extensions link the static\
        \ OpenSSL.\n  duckdb_extra=\"server/scripts/deps-openssl.sh\"\nelse\n  image=\"${HARDCHARGER_MANYLINUX_IMAGE##*/}\"\
        \n  digest=\"${image##*@sha256:}\"\n  [ -n \"$image\" ] && [ \"$digest\" != \"$image\" ] || { echo \"no pinned manylinux\
        \ image: '$image'\"; exit 1; }\n  toolchain=\"${image%%@*} ${digest:0:12}\"\n  build=\"server/scripts/in-manylinux.sh\
        \ deps\"\n  # DuckDB's extensions link the static OpenSSL.\n  duckdb_extra=\"server/scripts/deps-openssl.sh\"\nfi\n\
        echo \"toolchain=$toolchain\" | tee -a \"$GITHUB_OUTPUT\"\necho \"build=$build\" >> \"$GITHUB_OUTPUT\"\necho \"duckdb_extra=$duckdb_extra\"\
        \ >> \"$GITHUB_OUTPUT\"\n# The DuckDB build's peak memory is what limits its parallelism on 2-CPU runners.\necho \"\
        CMAKE_BUILD_PARALLEL_LEVEL=$(getconf _NPROCESSORS_ONLN)\" >> \"$GITHUB_ENV\"\n"
    - name: OpenSSL, static (cached)
      uses: ./.github/actions/dep-cache
      with:
        dependency: openssl
        platform: ${{ matrix.name }}
        toolchain: ${{ steps.toolchain.outputs.toolchain }}
        build: ${{ steps.toolchain.outputs.build }}
    - name: Arrow (cached)
      uses: ./.github/actions/dep-cache
      with:
        dependency: arrow
        platform: ${{ matrix.name }}
        toolchain: ${{ steps.toolchain.outputs.toolchain }}
        build: ${{ steps.toolchain.outputs.build }}
    - name: replxx (cached)
      uses: ./.github/actions/dep-cache
      with:
        dependency: replxx
        platform: ${{ matrix.name }}
        toolchain: ${{ steps.toolchain.outputs.toolchain }}
        build: ${{ steps.toolchain.outputs.build }}
    - name: DuckDB (cached)
      uses: ./.github/actions/dep-cache
      with:
        dependency: duckdb
        platform: ${{ matrix.name }}
        toolchain: ${{ steps.toolchain.outputs.toolchain }}
        extra-recipes: ${{ steps.toolchain.outputs.duckdb_extra }}
        build: ${{ steps.toolchain.outputs.build }}
    - uses: mozilla-actions/sccache-action@v0.0.11
    - name: sccache directory (restore)
      uses: ./.github/actions/sccache-dir
      with:
        mode: restore
        name: ${{ matrix.name }}
        toolchain: ${{ steps.toolchain.outputs.toolchain }}
    - name: Build the server
      id: build
      run: "# (chargewire-client-tests and chargewire-sdk-tests, Chargewire's own tests, build on request.)\nif [ \"$RUNNER_OS\"\
        \ = Linux ]; then\n  server/scripts/in-manylinux.sh server server/build -DHARDCHARGER_STATIC=ON \\\n    -DHARDCHARGER_WEB_UI=\"\
        $HARDCHARGER_UI_TARBALL\"\n  server/scripts/in-manylinux.sh build server/build --target chargewire-client-tests chargewire-sdk-tests\n\
        else\n  read -ra launcher <<< \"$(server/scripts/sccache-launcher.sh || true)\"\n  cmake -S server -B server/build\
        \ -G Ninja -DCMAKE_BUILD_TYPE=Release \\\n        -DHARDCHARGER_STATIC=ON -DHARDCHARGER_WEB_UI=\"$HARDCHARGER_UI_TARBALL\"\
        \ \\\n        -DOPENSSL_ROOT_DIR=\"$PWD/server/.deps/openssl-install\" -DOPENSSL_USE_STATIC_LIBS=TRUE \\\n       \
        \ \"${launcher[@]}\"\n  cmake --build server/build\n  cmake --build server/build --target chargewire-client-tests\
        \ chargewire-sdk-tests\nfi\nserver/build/hardcharger-server --version\nserver/build/hardcharger-server --print-duckdb-version\n\
        server/build/hardcharger --version\n"
    - name: Prove built-in DuckLake collision and fixture isolation
      run: 'set -euo pipefail

        test_file=server/unit/ducklake_plan_check_test.cc

        cp "$test_file" "$RUNNER_TEMP/ducklake_plan_check_test.fixed.cc"

        server/build/hardcharger-unit-tests --gtest_filter=''DuckLakePlanCheck.*''

        python3 - <<''PY''

        from pathlib import Path

        p = Path(''server/unit/ducklake_plan_check_test.cc'')

        s = p.read_text()

        line = ''    config_.options.load_extensions = false;\n''

        assert s.count(line) == 1

        p.write_text(s.replace(line, ''''))

        PY

        server/scripts/in-manylinux.sh build server/build

        set +e

        server/build/hardcharger-unit-tests --gtest_filter=''DuckLakePlanCheck.*'' > "$RUNNER_TEMP/ducklake-plan-mutation.log"
        2>&1

        mutation_status=$?

        set -e

        cat "$RUNNER_TEMP/ducklake-plan-mutation.log"

        test "$mutation_status" -ne 0

        grep -F ''already exists'' "$RUNNER_TEMP/ducklake-plan-mutation.log"

        cp "$RUNNER_TEMP/ducklake_plan_check_test.fixed.cc" "$test_file"

        server/scripts/in-manylinux.sh build server/build

        server/build/hardcharger-unit-tests --gtest_filter=''DuckLakePlanCheck.*''

        '
    - name: sccache directory (save)
      if: always()
      uses: ./.github/actions/sccache-dir
      with:
        mode: save
        name: ${{ matrix.name }}
        toolchain: ${{ steps.toolchain.outputs.toolchain }}
    - name: Start PostgreSQL (Linux)
      if: runner.os == 'Linux'
      run: "docker run -d --name hardcharger-test-pg -e POSTGRES_USER=hardcharger \\\n  -e POSTGRES_PASSWORD=hardcharger -e\
        \ POSTGRES_DB=hardcharger \\\n  -p 127.0.0.1:55433:5432 postgres:17-alpine\nfor _ in $(seq 1 30); do docker exec hardcharger-test-pg\
        \ pg_isready -U hardcharger && break; sleep 1; done\n"
    - name: Start PostgreSQL (macOS)
      if: runner.os == 'macOS'
      run: 'brew install postgresql@17

        pg="$(brew --prefix postgresql@17)/bin"

        # Passwords are checked, as in the Linux jobs'' container: a test signs in with a

        # wrong one and expects to be refused.

        printf ''hardcharger\n'' > "$RUNNER_TEMP/pgpass"

        "$pg/initdb" -D "$RUNNER_TEMP/pg" -U hardcharger --auth=scram-sha-256 --pwfile="$RUNNER_TEMP/pgpass"

        "$pg/pg_ctl" -D "$RUNNER_TEMP/pg" -o "-p 55433 -k $RUNNER_TEMP" -l "$RUNNER_TEMP/pg.log" -w start

        PGPASSWORD=hardcharger "$pg/createdb" -h 127.0.0.1 -p 55433 -U hardcharger hardcharger

        '
    - uses: astral-sh/setup-uv@v10.3.0
    - name: Test services
      if: runner.os == 'Linux'
      run: docker compose -f server/tests/docker-compose.yml up -d --wait
    - name: Hardcharger tests
      working-directory: server/tests
      run: 'uv venv .venv --python 3.14

        uv pip install --python .venv/bin/python -r pyproject.toml

        # Everything, access control included, on the one build, the one that ships (the

        # DuckLake suites need Docker, which only the Linux runners have; macOS deselects

        # them by marker, visibly): in parallel (pytest-xdist; every test starts its own

        # servers on ports, directories and databases of its own), then the `serial`

        # tests alone.

        only=""

        if [ "$RUNNER_OS" != "Linux" ]; then only=" and not services"; fi

        echo "CPUs: $(getconf _NPROCESSORS_ONLN); pytest-xdist workers: $HARDCHARGER_TEST_XDIST_WORKERS"

        .venv/bin/python -m pytest -q -n "$HARDCHARGER_TEST_XDIST_WORKERS" -m "not serial$only" --durations=10

        .venv/bin/python -m pytest -q -m "serial$only" --durations=5

        '
    - name: Access-control tests on the DuckDB store
      if: matrix.name == 'linux-amd64'
      working-directory: server/tests
      env:
        HARDCHARGER_TEST_RBAC_STORE: duckdb
      run: '.venv/bin/python -m pytest -q -n "$HARDCHARGER_TEST_XDIST_WORKERS" -m "rbac_store and not serial" --durations=5

        .venv/bin/python -m pytest -q -m "rbac_store and serial" --durations=5

        '
    - name: Client shell tests
      run: bash server/tests/test_client_shell.sh
    - name: Chargewire client library tests
      run: server/build/chargewire/chargewire-client-tests
    - name: Chargewire SDK unit tests
      run: server/build/chargewire/chargewire-sdk-tests
    - name: Chargewire conformance suite
      working-directory: third_party/chargewire/conformance
      env:
        CHARGEWIRE_TEST_SERVER_BINARY: ${{ github.workspace }}/server/build/hardcharger-server
        CHARGEWIRE_TEST_REQUIRE_READ_ONLY: '1'
        CHARGEWIRE_TEST_SERVER_PASSWORD_ENV: HARDCHARGER_ADMIN_PASSWORD
        CHARGEWIRE_TEST_SERVER_USERNAME: chargewire
        CHARGEWIRE_TEST_SERVER_IDLE_FLAG: --session-idle-timeout
        CHARGEWIRE_TEST_SERVER_MTLS_FLAG: --mtls-ca-cert
        CHARGEWIRE_TEST_SERVER_CORS_FLAG: --cors-origins
        CHARGEWIRE_TEST_SERVER_OAUTH_ARGS: --token-allowed-issuer {issuer} --token-allowed-audience {client_id} --token-default-role
          admin --token-authorized-emails {identity} --oauth-client-id {client_id} --oauth-base-url {base_url} --oauth-provider-name
          {provider} --oauth-max-flows {max_flows}
        CHARGEWIRE_TEST_SERVER_OAUTH_SECRET_ENV: HARDCHARGER_OAUTH_CLIENT_SECRET
        CHARGEWIRE_TEST_SERVER_DRAIN_FLAG: --shutdown-grace-period-seconds
        CHARGEWIRE_TEST_AUTHZ_CREATE_USER: CREATE ROLE {user}_role; CREATE USER {user} WITH PASSWORD '{password}'; GRANT {user}_role
          TO {user}
        CHARGEWIRE_TEST_AUTHZ_GRANT: GRANT SELECT ON {table} TO {user}_role
        CHARGEWIRE_TEST_AUTHZ_REVOKE: REVOKE SELECT ON {table} FROM {user}_role
        HARDCHARGER_ADMIN_USERNAME: chargewire
        HARDCHARGER_PRINT_QUERIES: 'false'
      run: 'uv venv .venv --python 3.14

        uv pip install --python .venv/bin/python -e .

        key="$(openssl rand -hex 32)"

        export CHARGEWIRE_TEST_AUTHZ_SERVER_ENV="HARDCHARGER_RBAC_STORE_URI=duckdb:{tmp}/rbac.duckdb HARDCHARGER_SECRET_KEY=$key"

        .venv/bin/python -m pytest -q

        '
    - name: Failed-statement answers, 200 times
      if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.failure_repro == true }}
      working-directory: third_party/chargewire/conformance
      env:
        HARDCHARGER_ADMIN_USERNAME: chargewire
        HARDCHARGER_PRINT_QUERIES: 'false'
      run: bash "$GITHUB_WORKSPACE/.github/scripts/failure-repro.sh" "$GITHUB_WORKSPACE/server/build/hardcharger-server" "$GITHUB_WORKSPACE/server/build/chargewire/chargewire-duckdb"
        .venv/bin/python
    - name: Keep an unsigned copy (the signature check's proof)
      if: matrix.name == 'macos-arm64' && needs.changes.outputs.sign == 'true'
      run: cp server/build/hardcharger "$RUNNER_TEMP/unsigned-proof"
    - name: Retry transient Apple timestamp service failures
      if: matrix.name == 'macos-arm64' && needs.changes.outputs.sign == 'true'
      uses: ./.github/actions/apple-signing-retry
    - name: Sign and notarize the client (macOS)
      if: matrix.name == 'macos-arm64' && needs.changes.outputs.sign == 'true'
      continue-on-error: true
      uses: toitlang/action-macos-sign-notarize@v1.3.0
      with:
        certificate: ${{ secrets.APPLE_CERTIFICATE }}
        certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        username: ${{ secrets.APPLE_ID_USERNAME }}
        password: ${{ secrets.APPLE_ID_PASSWORD }}
        apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
        app-path: server/build/hardcharger
    - name: Sign and notarize the server (macOS)
      if: matrix.name == 'macos-arm64' && needs.changes.outputs.sign == 'true'
      continue-on-error: true
      uses: toitlang/action-macos-sign-notarize@v1.3.0
      with:
        certificate: ${{ secrets.APPLE_CERTIFICATE }}
        certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        username: ${{ secrets.APPLE_ID_USERNAME }}
        password: ${{ secrets.APPLE_ID_PASSWORD }}
        apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
        app-path: server/build/hardcharger-server
        entitlements-path: server/macos/entitlements.plist
    - name: Check the signatures (macOS)
      if: matrix.name == 'macos-arm64' && needs.changes.outputs.sign == 'true'
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: "if .github/scripts/verify-macos-signature.sh \"$RUNNER_TEMP/unsigned-proof\" 2> \"$RUNNER_TEMP/proof.err\"; then\n\
        \  echo \"the signature check passed an unsigned binary\"; exit 1\nfi\ncat \"$RUNNER_TEMP/proof.err\"\ngrep -q \"\
        not a Developer ID Application signature\" \"$RUNNER_TEMP/proof.err\"\n.github/scripts/verify-macos-signature.sh \\\
        \n  --entitlements server/macos/entitlements.plist server/build/hardcharger-server -- server/build/hardcharger\nserver/build/hardcharger-server\
        \ --version\nserver/build/hardcharger --version\n"
    - name: Package
      run: "# Two self-contained binaries (HARDCHARGER_STATIC: DuckDB and every other\n# dependency linked in, as GizmoSQL's),\
        \ the licence, the third-party notices (the\n# binaries' and the embedded web UI's) and the changelog; nothing else,\
        \ never the\n# tests.\nexport LC_ALL=C  # the checks below compare sorted globs\nstage=\"dist/hardcharger-${{ matrix.name\
        \ }}\"\nmkdir -p \"$stage/bin\"\ninstall -m 755 server/build/hardcharger-server server/build/hardcharger \"$stage/bin/\"\
        \ncp LICENSE CHANGELOG.md THIRD_PARTY_NOTICES.md \"$stage/\"\ntar -xzOf \"$HARDCHARGER_UI_TARBALL\" hardcharger-ui/third-party-notices.txt\
        \ > \"$stage/THIRD_PARTY_NOTICES-web-ui.txt\"\ntest \"$(cd \"$stage\" && printf '%s ' *)\" = \"CHANGELOG.md LICENSE\
        \ THIRD_PARTY_NOTICES-web-ui.txt THIRD_PARTY_NOTICES.md bin \"\ntest \"$(cd \"$stage/bin\" && printf '%s ' *)\" =\
        \ \"hardcharger hardcharger-server \"\n\"$stage/bin/hardcharger-server\" --version\n\"$stage/bin/hardcharger\" --version\n\
        # The binaries carry the same notices (--licenses): the server its own and then\n# the web UI's, the client its own.\n\
        \"$stage/bin/hardcharger-server\" --licenses > \"$RUNNER_TEMP/server-licenses.txt\"\n{ cat \"$stage/THIRD_PARTY_NOTICES.md\"\
        ; printf '\\n\\n'; cat \"$stage/THIRD_PARTY_NOTICES-web-ui.txt\"; } \\\n  > \"$RUNNER_TEMP/expected-licenses.txt\"\
        \ncmp \"$RUNNER_TEMP/server-licenses.txt\" \"$RUNNER_TEMP/expected-licenses.txt\"\n\"$stage/bin/hardcharger\" --licenses\
        \ > \"$RUNNER_TEMP/client-licenses.txt\"\ncmp \"$RUNNER_TEMP/client-licenses.txt\" \"$stage/THIRD_PARTY_NOTICES.md\"\
        \ntar -C dist -czf \"dist/hardcharger-${{ matrix.name }}.tar.gz\" \"hardcharger-${{ matrix.name }}\"\n"
    - name: Check the glibc baseline (Linux)
      if: runner.os == 'Linux'
      run: "libc=\"/lib/$(uname -m)-linux-gnu/libc.so.6\"\nif server/scripts/check-glibc-baseline.sh \"$libc\" >/dev/null\
        \ 2>&1; then\n  echo \"the baseline check passed $libc, which needs a newer glibc\"; exit 1\nfi\nstage=\"dist/hardcharger-${{\
        \ matrix.name }}\"\nserver/scripts/check-glibc-baseline.sh \"$stage\"/bin/*\n"
    - name: Check the shipped libraries
      run: "if [ \"$RUNNER_OS\" = Linux ]; then probe=/usr/bin/curl; else probe=\"$(brew --prefix postgresql@17)/bin/psql\"\
        ; fi\nif server/scripts/check-shipped-libs.sh \"$probe\" >/dev/null 2>&1; then\n  echo \"the library check passed\
        \ $probe, which links more than the system's\"; exit 1\nfi\nstage=\"dist/hardcharger-${{ matrix.name }}\"\nserver/scripts/check-shipped-libs.sh\
        \ \"$stage\"/bin/*\n"
    - name: Smoke-test the tarball (macOS)
      if: runner.os == 'macOS'
      run: env -i HOME="$RUNNER_TEMP" PATH=/usr/bin:/bin bash server/scripts/smoke-tarball.sh "$PWD/dist/hardcharger-${{ matrix.name
        }}.tar.gz"
    - uses: actions/upload-artifact@v7
      with:
        name: hardcharger-${{ matrix.name }}
        path: dist/hardcharger-${{ matrix.name }}.tar.gz
    - name: versions.json (Linux amd64)
      if: matrix.name == 'linux-amd64'
      run: "tag=()\nif [[ \"$GITHUB_REF\" == refs/tags/v* ]]; then tag=(--tag \"$GITHUB_REF_NAME\"); fi\npython3 .github/scripts/versions_json.py\
        \ --binary \"dist/hardcharger-${{ matrix.name }}/bin/hardcharger-server\" \\\n  ${tag[@]+\"${tag[@]}\"} > dist/versions.json\n\
        cat dist/versions.json\n"
    - uses: actions/upload-artifact@v7
      if: matrix.name == 'linux-amd64'
      with:
        name: hardcharger-versions
        path: dist/versions.json
        if-no-files-found: error
