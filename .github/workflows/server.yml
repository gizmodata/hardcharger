# The Hardcharger server: builds and tests on every push and pull request; on a v* tag,
# also publishes the container image (ghcr.io, private) and the GitHub Release. The
# tests run on the tagged commit itself, in this workflow, before anything is published.
# A tag vX.Y.Z-rc.N is a release candidate: the same gate, a pre-release on GitHub and
# images :X.Y.Z-rc.N and :sha-<short>, never :latest (.github/scripts/release.sh).
#
# What runs where (the `changes` job decides):
#   - a v* tag: everything, the sanitizers included, always (the release gate);
#   - a manual run (workflow_dispatch) or a pull request: everything but the sanitizers
#     (ASan, TSan), which a manual run adds with `full`;
#   - a push to main: when the same commit already passed this workflow in a push or
#     manual run (main moves by fast-forwarding a branch that ran it), no tests at all:
#     the image job publishes `:main` from that run's tested tarballs, and the
#     compile-cache warm-up jobs build (never test) each platform whose compile cache main
#     lacks (see `warm-linux-amd64`). Otherwise the same as a manual run.
#
# The iOS app (ios/): its simulator build and tests (`ios`) run only on a v* tag and on a
# manual run with `ios` (macOS runners are expensive; never on a push or pull request); the
# signed device build (`ios-archive`, an .ipa artifact) also runs on a manual run with
# both `ios` and `sign`. Only a v* tag uploads the .ipa to TestFlight.
#
# Code signing (docs/releasing.md): on a v* tag always, and on a manual run with `sign`
# (from a release/* branch: the `production` environment, which holds the signing secrets,
# admits only those and v* tags), the macOS server and client are signed with GizmoData's
# Developer ID and notarized (in the build job, before the tarball is packed) and the Windows
# executables and MSIs are Authenticode-signed (windows.yml); `verify signatures (...)` then
# checks the artifacts the release takes. Never on pull requests or pushes. A tag whose
# artifacts are not all signed publishes nothing: the image and the release need those checks.
name: server

# Not for changes that build, test and package nothing: the documentation (docs/, Markdown
# other than the CHANGELOG.md and THIRD_PARTY_NOTICES.md the tarballs ship, the notices'
# texts and the UI's Markdown, which its lint checks), the
# benchmarks (bench/), the Python package (python/, workflow.yml), the other workflows and
# the docs' version-label check (.github/scripts/check_no_version_labels.py, run by workflow.yml).
# Path filters never apply to tags; a manual run is always available.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**"
      - "!docs/**"
      - "!bench/**"
      - "!python/**"
      - "!**/*.md"
      - "CHANGELOG.md"
      - "THIRD_PARTY_NOTICES.md"
      - "ui/**/*.md"
      - "server/third-party-notices/**"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!.github/workflows/workflow.yml"
      - "!.github/workflows/dockerhub-check.yml"
      - "!.github/scripts/check_no_version_labels.py"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!bench/**"
      - "!python/**"
      - "!**/*.md"
      - "CHANGELOG.md"
      - "THIRD_PARTY_NOTICES.md"
      - "ui/**/*.md"
      - "server/third-party-notices/**"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!.github/workflows/workflow.yml"
      - "!.github/workflows/dockerhub-check.yml"
      - "!.github/scripts/check_no_version_labels.py"
  workflow_dispatch:
    inputs:
      full:
        description: Also run the AddressSanitizer and ThreadSanitizer jobs (tags always do)
        type: boolean
        default: false
      failure_repro:
        description: Also run the failed-statement conformance cases 200 times against each server
        type: boolean
        default: false
      reuse_tested:
        description: Skip the tests when this commit already passed them, as a push to main does (to check that path; nothing is published)
        type: boolean
        default: false
      sign:
        description: Sign (and notarize) the macOS and Windows artifacts, as a tag does (release/* branches only; nothing is published)
        type: boolean
        default: false
      ios:
        description: Also build the iOS app for the simulator and run its unit and UI tests (tags always do)
        type: boolean
        default: false

permissions:
  contents: read

# A newer run on the same branch makes an older one pointless: cancel it. Never on a tag:
# a release run must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Every server compile goes through sccache (mozilla-actions/sccache-action puts it on
# PATH), with a local cache directory that .github/actions/sccache-dir carries between
# runs as one actions/cache entry per job, rather than sccache's GitHub Actions backend,
# which stores one cache entry per object file. server/scripts/sccache-launcher.sh starts
# the server before each build and turns the cache off if it won't answer.
env:
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 2G
  # pytest-xdist workers for the server tests. The tests mostly wait on servers they
  # start, so more workers than CPUs pays: on the 2-CPU Linux runners the parallel pass
  # took 230-250 s with 4 workers and 208-217 s with 6 (the sanitizer jobs use fewer).
  HARDCHARGER_TEST_XDIST_WORKERS: "6"

jobs:
  # The web UI (ui/) every server build in this run embeds, built once here from the same
  # commit. Its build is reproducible (package-lock.json, npm ci); the content SHA-256 it
  # prints is the one each server build logs when it embeds the tarball.
  web-ui:
    name: web UI (build)
    needs: changes
    if: needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build and package the UI
        working-directory: ui
        run: |
          npm ci
          npm run vendor:verify
          npm run build
          npm run package
          cat release/SHA256SUMS
          echo "content SHA-256: $(cat release/hardcharger-ui-*.CONTENT_SHA256)"
      - uses: actions/upload-artifact@v7
        with:
          name: hardcharger-ui
          path: |
            ui/release/hardcharger-ui-*.tar.gz
            ui/release/hardcharger-ui-*.CONTENT_SHA256
          if-no-files-found: error

  # Whether this run touches the web UI: its own checks and browser tests (ui-checks,
  # ui-e2e) run when ui/, the server's web UI code or the chargewire submodule changed, and
  # always on main, on tags and on a manual run.
  # And, on a push to main only (or a manual run with reuse_tested), whether this commit
  # already passed the whole workflow (.github/scripts/already-tested.sh): then every job
  # but the image is skipped. Any doubt answers no, and the commit is tested.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read  # the earlier runs of this workflow, their jobs and artifacts
    outputs:
      ui: ${{ steps.diff.outputs.ui }}
      tested: ${{ steps.tested.outputs.tested }}
      tested_run: ${{ steps.tested.outputs.run }}
      warm: ${{ steps.warm.outputs.warm }}
      sign: ${{ steps.sign.outputs.sign }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Whether this run signs the macOS and Windows artifacts: every v* tag, and a manual run
      # with `sign`; nothing else (never a pull request or a push).
      - id: sign
        env:
          EVENT: ${{ github.event_name }}
          SIGN: ${{ inputs.sign == true }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || { [ "$EVENT" = workflow_dispatch ] && [ "$SIGN" = true ]; }; then
            sign=true
          else
            sign=false
          fi
          echo "sign=$sign" | tee -a "$GITHUB_OUTPUT"
      - id: tested
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REUSE: ${{ inputs.reuse_tested == true }}
          SIGNING: ${{ steps.sign.outputs.sign }}
        run: |
          # (A signing run builds everything: there is nothing signed to reuse.)
          if { [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; } ||
             { [ "$EVENT" = workflow_dispatch ] && [ "$REUSE" = true ] && [ "$SIGNING" != true ]; }; then
            .github/scripts/already-tested.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
              > "$RUNNER_TEMP/tested" 2>> "$GITHUB_STEP_SUMMARY" || echo "tested=false" > "$RUNNER_TEMP/tested"
          else
            echo "tested=false" > "$RUNNER_TEMP/tested"
            { echo "### Full matrix"; echo
              echo "A ${EVENT} on ${GITHUB_REF} always runs the tests$([[ "$GITHUB_REF" == refs/tags/* ]] && echo ', the sanitizers included')."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Exactly one answer: true only when the script said so.
          if grep -qx 'tested=true' "$RUNNER_TEMP/tested" && [[ "$GITHUB_REF" != refs/tags/* ]]; then
            grep -E '^(tested|run)=' "$RUNNER_TEMP/tested" >> "$GITHUB_OUTPUT"
          else
            echo "tested=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/tested"
      # The release's version arithmetic (.github/scripts/release.sh): the version string,
      # the image tags, the MSI version, the CHANGELOG extraction. On a tag, also the tag
      # against server/CMakeLists.txt and its CHANGELOG section, here, before the matrix
      # runs, rather than in the release job after it.
      - name: Release scripts
        run: |
          bash .github/scripts/test-release.sh
          python3 .github/scripts/test_versions_json.py
          sudo apt-get install -y -q minisign > /dev/null
          python3 .github/scripts/test_updater_feed.py
          python3 .github/scripts/check_python_version.py
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 .github/scripts/check_python_version.py --server-tag "$GITHUB_REF_NAME"
            .github/scripts/release.sh check-tag "$GITHUB_REF_NAME"
            .github/scripts/release.sh changelog "${GITHUB_REF_NAME#v}" > /dev/null
            echo "release $GITHUB_REF_NAME, pre-release: $(.github/scripts/release.sh prerelease "${GITHUB_REF_NAME#v}")"
          fi
      # Its tests, against a fake gh (about a second).
      - name: Test the compile-cache check
        run: bash .github/scripts/test-stale-compile-caches.sh
      # On main, when the tests are skipped (so no build saves a compile cache there): the
      # build platforms whose compile cache main lacks or has only an old one of
      # (.github/scripts/stale-compile-caches.sh), as a JSON list for the warm-up jobs. Any
      # doubt lists every platform. Everywhere else: none (`[]`).
      - id: warm
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ steps.tested.outputs.tested }}
        run: |
          # Every leg of the build job's and windows.yml's matrices (not the sanitizers').
          platforms=(linux-amd64 linux-arm64 macos-arm64 windows-amd64 windows-arm64)
          if [ "$TESTED" = true ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            if ! out=$(.github/scripts/stale-compile-caches.sh "$GITHUB_REPOSITORY" "${platforms[@]}" 2>> "$GITHUB_STEP_SUMMARY") ||
               [[ "$out" != "warm=["* ]]; then
              out="warm=$(jq -cn '$ARGS.positional' --args "${platforms[@]}")"
            fi
          else
            out="warm=[]"
          fi
          echo "$out" | tee -a "$GITHUB_OUTPUT"
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          paths=(ui server/src/web_ui.cc server/src/web_ui.hpp server/cmake/web_ui.cmake
                 server/unit/web_ui_test.cc server/tests/test_web_ui.py third_party/chargewire
                 .github/workflows/server.yml)
          base=$([ "$EVENT" = pull_request ] && echo "$PR_BASE" || echo "$BEFORE")
          if [ "$GITHUB_REF" = refs/heads/main ] || [[ "$GITHUB_REF" == refs/tags/* ]] || [ "$EVENT" = workflow_dispatch ]; then
            ui=true
          elif [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            ui=true  # nothing to compare with (a new branch): run them
          elif git diff --quiet "$base" HEAD -- "${paths[@]}"; then
            ui=false
          else
            ui=true  # changed (or git failed: run them rather than guess)
          fi
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "web UI checks and browser tests: $ui"

  # The UI's lint (eslint, prettier), typecheck (every TypeScript project), unit tests, and
  # the vendored @gizmodata/chargewire against the commit it pins (rebuilt from
  # gizmodata/chargewire-js).
  ui-checks:
    name: web UI (lint, typecheck, unit tests, client provenance)
    needs: changes
    if: needs.changes.outputs.ui == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Lint (eslint, prettier)
        run: npm run lint
      - name: Typecheck (the app, the unit tests, the e2e tests, the configs)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: The vendored client is what its pinned commit builds
        run: node scripts/vendor-chargewire.mjs --verify --rebuild

  # The UI's browser tests, in Chromium and WebKit, against the Linux x86-64 server built in
  # this run, which serves the UI it embeds (access control on, so PostgreSQL). They fail,
  # never skip, when the server can't start.
  ui-e2e:
    name: web UI e2e (${{ matrix.browser }})
    needs: [changes, build]
    if: needs.changes.outputs.ui == 'true' && needs.changes.outputs.tested != 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hardcharger
          POSTGRES_PASSWORD: hardcharger
          POSTGRES_DB: hardcharger
        ports: ["127.0.0.1:55460:5432"]
        options: >-
          --health-cmd "pg_isready -U hardcharger" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      HARDCHARGER_UI_TEST_EMBEDDED: "1"
      HARDCHARGER_UI_TEST_RBAC_STORE_URI: postgresql://hardcharger:hardcharger@127.0.0.1:55460/hardcharger
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: hardcharger-linux-amd64
          path: ${{ runner.temp }}/server
      - name: Unpack the server
        run: |
          tar -C "$RUNNER_TEMP/server" -xzf "$RUNNER_TEMP/server/hardcharger-linux-amd64.tar.gz"
          bin="$RUNNER_TEMP/server/hardcharger-linux-amd64/bin/hardcharger-server"
          "$bin" --version
          echo "HARDCHARGER_UI_TEST_SERVER_BINARY=$bin" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: End-to-end tests
        run: npx playwright test --project ${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-e2e-${{ matrix.browser }}
          path: |
            ui/test-results
            ui/playwright-report
          retention-days: 14

  build:
    name: build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux servers are built in manylinux_2_28 (AlmaLinux 8, glibc 2.28), so the
          # tarballs run on any distribution with glibc 2.28 or newer, not only on the
          # runner image. Pinned by digest: a new image is a deliberate bump (and a cold
          # dependency build), never a surprise.
          # (Each leg and step marked &name is reused, unchanged, by the compile-cache
          # warm-up jobs below; YAML anchors.)
          - &leg-linux-amd64
            name: linux-amd64
            runner: ubuntu-24.04
            manylinux: quay.io/pypa/manylinux_2_28_x86_64:2026.10.10-1@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae
          - &leg-linux-arm64
            name: linux-arm64
            runner: ubuntu-24.04-arm
            manylinux: quay.io/pypa/manylinux_2_28_aarch64:2026.10.10-1@sha256:abd1230aa9e4058a74b89d27cd14ba18c0db036d7bfe6e6f219a29ea63c24eb6
          - &leg-macos-arm64
            name: macos-arm64
            runner: macos-15
    needs: [changes, web-ui]
    if: needs.changes.outputs.tested != 'true'
    runs-on: ${{ matrix.runner }}
    # The macOS leg of a signing run reads the Apple secrets from the `production`
    # environment; every other leg and run uses none.
    environment: ${{ matrix.name == 'macos-arm64' && needs.changes.outputs.sign == 'true' && 'production' || '' }}
    env: &build-env
      HARDCHARGER_MANYLINUX_IMAGE: ${{ matrix.manylinux }}
    steps:
      - &build-checkout
        uses: actions/checkout@v7
      # Inside the checkout: the Linux build's container mounts only that.
      - uses: actions/download-artifact@v8
        with:
          name: hardcharger-ui
          path: server/.web-ui
      - &build-ui-tarball
        name: The web UI tarball
        run: |
          shopt -s nullglob
          ui=("$PWD"/server/.web-ui/hardcharger-ui-*.tar.gz)
          [ ${#ui[@]} -eq 1 ] || { echo "expected one hardcharger-ui tarball, found: ${ui[*]}"; exit 1; }
          echo "HARDCHARGER_UI_TARBALL=${ui[0]}" >> "$GITHUB_ENV"
      - &build-submodule
        name: Fetch the chargewire submodule
        run: git submodule update --init --depth 1
      # THIRD_PARTY_NOTICES.md (which every release artifact ships) is what
      # server/third-party-notices/ generates, for exactly the versions the dependency
      # recipes pin: a bump without its licence review fails here. No network.
      - name: Third-party notices are in step with the recipes
        run: python3 server/scripts/third-party-notices.py --check

      # (The Linux build tools are in the manylinux image; the build installs the rest.)
      - &build-tools
        name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Each dependency is cached on its own (.github/actions/dep-cache), keyed on its own
      # recipes and the exact toolchain: on Linux the manylinux image's tag and digest, on
      # macOS the Xcode and clang builds. Only what misses is built (in the manylinux image
      # on Linux), and each is saved right after it is built.
      - &build-toolchain
        name: Toolchain
        id: toolchain
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            clang=$(clang --version | head -1 | sed -nE 's/.*\((clang-[0-9.]+)\).*/\1/p')
            [ -n "$clang" ] || { echo "no clang build in: $(clang --version)"; exit 1; }
            toolchain="$(xcodebuild -version | tr '\n' ' ') $clang"
            build="server/scripts/build-deps.sh"
            # DuckDB's extensions link the static OpenSSL.
            duckdb_extra="server/scripts/deps-openssl.sh"
          else
            image="${HARDCHARGER_MANYLINUX_IMAGE##*/}"
            digest="${image##*@sha256:}"
            [ -n "$image" ] && [ "$digest" != "$image" ] || { echo "no pinned manylinux image: '$image'"; exit 1; }
            toolchain="${image%%@*} ${digest:0:12}"
            build="server/scripts/in-manylinux.sh deps"
            # DuckDB's extensions link the static OpenSSL.
            duckdb_extra="server/scripts/deps-openssl.sh"
          fi
          echo "toolchain=$toolchain" | tee -a "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "duckdb_extra=$duckdb_extra" >> "$GITHUB_OUTPUT"
          # The DuckDB build's peak memory is what limits its parallelism on 2-CPU runners.
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"
      # OpenSSL 3, static: linked into everything the release ships, so no user needs an
      # OpenSSL 3 of their own (EL8 has 1.1; a Mac has none outside Homebrew).
      - &build-dep-openssl
        name: OpenSSL, static (cached)
        uses: ./.github/actions/dep-cache
        with:
          dependency: openssl
          platform: ${{ matrix.name }}
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
          build: ${{ steps.toolchain.outputs.build }}
      - &build-dep-arrow
        name: Arrow (cached)
        uses: ./.github/actions/dep-cache
        with:
          dependency: arrow
          platform: ${{ matrix.name }}
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
          build: ${{ steps.toolchain.outputs.build }}
      - &build-dep-replxx
        name: replxx (cached)
        uses: ./.github/actions/dep-cache
        with:
          dependency: replxx
          platform: ${{ matrix.name }}
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
          build: ${{ steps.toolchain.outputs.build }}
      - &build-dep-duckdb
        name: DuckDB (cached)
        uses: ./.github/actions/dep-cache
        with:
          dependency: duckdb
          platform: ${{ matrix.name }}
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
          extra-recipes: ${{ steps.toolchain.outputs.duckdb_extra }}
          build: ${{ steps.toolchain.outputs.build }}

      - &build-sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - &build-sccache-restore
        name: sccache directory (restore)
        uses: ./.github/actions/sccache-dir
        with:
          mode: restore
          name: ${{ matrix.name }}
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
      # On Linux, in the manylinux image (server/scripts/build-portable-linux.sh, which
      # also checks the glibc baseline); the tests then run the binaries on the runner.
      - &build-server
        name: Build the server
        id: build
        run: |
          # (chargewire-client-tests and chargewire-sdk-tests, Chargewire's own tests, build on request.)
          if [ "$RUNNER_OS" = Linux ]; then
            server/scripts/in-manylinux.sh server server/build -DHARDCHARGER_STATIC=ON \
              -DHARDCHARGER_WEB_UI="$HARDCHARGER_UI_TARBALL"
            server/scripts/in-manylinux.sh build server/build --target chargewire-client-tests chargewire-sdk-tests
          else
            read -ra launcher <<< "$(server/scripts/sccache-launcher.sh || true)"
            cmake -S server -B server/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                  -DHARDCHARGER_STATIC=ON -DHARDCHARGER_WEB_UI="$HARDCHARGER_UI_TARBALL" \
                  -DOPENSSL_ROOT_DIR="$PWD/server/.deps/openssl-install" -DOPENSSL_USE_STATIC_LIBS=TRUE \
                  "${launcher[@]}"
            cmake --build server/build
            cmake --build server/build --target chargewire-client-tests chargewire-sdk-tests
          fi
          server/build/hardcharger-server --version
          server/build/hardcharger-server --print-duckdb-version
          server/build/hardcharger --version

      - name: sccache directory (save)
        if: always()
        uses: ./.github/actions/sccache-dir
        with:
          mode: save
          name: ${{ matrix.name }}
          toolchain: ${{ steps.toolchain.outputs.toolchain }}

      # PostgreSQL for the access-control grant store (the tests fail without it).
      - name: Start PostgreSQL (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name hardcharger-test-pg -e POSTGRES_USER=hardcharger \
            -e POSTGRES_PASSWORD=hardcharger -e POSTGRES_DB=hardcharger \
            -p 127.0.0.1:55433:5432 postgres:17-alpine
          for _ in $(seq 1 30); do docker exec hardcharger-test-pg pg_isready -U hardcharger && break; sleep 1; done
      - name: Start PostgreSQL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@17
          pg="$(brew --prefix postgresql@17)/bin"
          # Passwords are checked, as in the Linux jobs' container: a test signs in with a
          # wrong one and expects to be refused.
          printf 'hardcharger\n' > "$RUNNER_TEMP/pgpass"
          "$pg/initdb" -D "$RUNNER_TEMP/pg" -U hardcharger --auth=scram-sha-256 --pwfile="$RUNNER_TEMP/pgpass"
          "$pg/pg_ctl" -D "$RUNNER_TEMP/pg" -o "-p 55433 -k $RUNNER_TEMP" -l "$RUNNER_TEMP/pg.log" -w start
          PGPASSWORD=hardcharger "$pg/createdb" -h 127.0.0.1 -p 55433 -U hardcharger hardcharger

      - uses: astral-sh/setup-uv@v10.3.0
      # PostgreSQL and an S3 gateway for the DuckLake suites (Docker runs on the Linux
      # runners only; the macOS job deselects those suites by marker, visibly).
      - name: Test services
        if: runner.os == 'Linux'
        run: docker compose -f server/tests/docker-compose.yml up -d --wait
      - name: Hardcharger tests
        working-directory: server/tests
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -r pyproject.toml
          # Everything, access control included, on the one build, the one that ships (the
          # DuckLake suites need Docker, which only the Linux runners have; macOS deselects
          # them by marker, visibly): in parallel (pytest-xdist; every test starts its own
          # servers on ports, directories and databases of its own), then the `serial`
          # tests alone.
          only=""
          if [ "$RUNNER_OS" != "Linux" ]; then only=" and not services"; fi
          echo "CPUs: $(getconf _NPROCESSORS_ONLN); pytest-xdist workers: $HARDCHARGER_TEST_XDIST_WORKERS"
          .venv/bin/python -m pytest -q -n "$HARDCHARGER_TEST_XDIST_WORKERS" -m "not serial$only" --durations=10
          .venv/bin/python -m pytest -q -m "serial$only" --durations=5
      # Every test that takes the `store` fixture (marker rbac_store: all the access-control
      # suites) once more, on the DuckDB file store instead of PostgreSQL. One job is enough:
      # the DuckDB store's own tests (test_rbac_duckdb_store.py) run in every job above.
      - name: Access-control tests on the DuckDB store
        if: matrix.name == 'linux-amd64'
        working-directory: server/tests
        env:
          HARDCHARGER_TEST_RBAC_STORE: duckdb
        run: |
          .venv/bin/python -m pytest -q -n "$HARDCHARGER_TEST_XDIST_WORKERS" -m "rbac_store and not serial" --durations=5
          .venv/bin/python -m pytest -q -m "rbac_store and serial" --durations=5
      # The 1.x client shell script, ported (test_client_shell.py runs it too, case by case).
      - name: Client shell tests
        run: bash server/tests/test_client_shell.sh
      # The Chargewire client library's own tests (unit, and live against chargewire-duckdb).
      - name: Chargewire client library tests
        run: server/build/chargewire/chargewire-client-tests
      - name: Chargewire SDK unit tests
        run: server/build/chargewire/chargewire-sdk-tests
      - name: Chargewire conformance suite
        working-directory: third_party/chargewire/conformance
        env:
          CHARGEWIRE_TEST_SERVER_BINARY: ${{ github.workspace }}/server/build/hardcharger-server
          CHARGEWIRE_TEST_SERVER_PASSWORD_ENV: HARDCHARGER_ADMIN_PASSWORD
          CHARGEWIRE_TEST_SERVER_USERNAME: chargewire
          CHARGEWIRE_TEST_SERVER_IDLE_FLAG: --session-idle-timeout
          # The flag naming the client CA in the mutual-TLS tests (test_mtls.py).
          CHARGEWIRE_TEST_SERVER_MTLS_FLAG: --mtls-ca-cert
          # Hardcharger's flag for the CORS allow-list (test_http.py's credentials tests).
          CHARGEWIRE_TEST_SERVER_CORS_FLAG: --cors-origins
          # How test_oauth_browser.py configures browser sign-in on Hardcharger (a template).
          CHARGEWIRE_TEST_SERVER_OAUTH_ARGS: >-
            --token-allowed-issuer {issuer} --token-allowed-audience {client_id} --token-default-role admin
            --token-authorized-emails {identity} --oauth-client-id {client_id} --oauth-base-url {base_url}
            --oauth-provider-name {provider} --oauth-max-flows {max_flows}
          CHARGEWIRE_TEST_SERVER_OAUTH_SECRET_ENV: HARDCHARGER_OAUTH_CLIENT_SECRET
          # One-signal draining (test_lifecycle.py) waits this long for running work.
          CHARGEWIRE_TEST_SERVER_DRAIN_FLAG: --shutdown-grace-period-seconds
          # Metadata and prepared statements under access control (test_authorization.py),
          # on a server of its own with the DuckDB access-control store; privileges go to roles.
          CHARGEWIRE_TEST_AUTHZ_CREATE_USER: "CREATE ROLE {user}_role; CREATE USER {user} WITH PASSWORD '{password}'; GRANT {user}_role TO {user}"
          CHARGEWIRE_TEST_AUTHZ_GRANT: "GRANT SELECT ON {table} TO {user}_role"
          CHARGEWIRE_TEST_AUTHZ_REVOKE: "REVOKE SELECT ON {table} FROM {user}_role"
          HARDCHARGER_ADMIN_USERNAME: chargewire
          HARDCHARGER_PRINT_QUERIES: "false"
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -e .
          key="$(openssl rand -hex 32)"
          export CHARGEWIRE_TEST_AUTHZ_SERVER_ENV="HARDCHARGER_RBAC_STORE_URI=duckdb:{tmp}/rbac.duckdb HARDCHARGER_SECRET_KEY=$key"
          .venv/bin/python -m pytest -q
      # On request (workflow_dispatch input failure_repro): every way a running statement
      # can fail before or during its answer (streamed, split, prepared), 200 times against
      # each server. The only acceptable answers are the error response or an incomplete
      # stream, with the statement's own error.
      - name: Failed-statement answers, 200 times
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.failure_repro == true }}
        working-directory: third_party/chargewire/conformance
        env:
          HARDCHARGER_ADMIN_USERNAME: chargewire
          HARDCHARGER_PRINT_QUERIES: "false"
        run: bash "$GITHUB_WORKSPACE/.github/scripts/failure-repro.sh" "$GITHUB_WORKSPACE/server/build/hardcharger-server" "$GITHUB_WORKSPACE/server/build/chargewire/chargewire-duckdb" .venv/bin/python

      # Code signing (macOS, on a signing run): the client and the server, signed with
      # GizmoData's Developer ID Application certificate and the hardened runtime, and
      # notarized by Apple (toitlang/action-macos-sign-notarize, as GizmoSQL's releases), after
      # the tests and before the tarball is packed, so the package checks, the smoke test, the
      # artifact and SHA256SUMS all have the signed binaries. The server's entitlements
      # (server/macos/entitlements.plist) only turn library validation off, for the DuckDB
      # extensions a user INSTALLs. The client is signed first: the action leaves its
      # entitlements argument in the job's environment, and a signing after the server's would
      # give the client the server's entitlements.
      - name: Keep an unsigned copy (the signature check's proof)
        if: matrix.name == 'macos-arm64' && needs.changes.outputs.sign == 'true'
        run: cp server/build/hardcharger "$RUNNER_TEMP/unsigned-proof"
      - name: Sign and notarize the client (macOS)
        if: matrix.name == 'macos-arm64' && needs.changes.outputs.sign == 'true'
        # This action immediately looks up Apple's ticket after acceptance. The strict
        # mandatory verifier below retries propagation and still fails closed on any
        # missing/broken signature, wrong team, absent ticket or Gatekeeper rejection.
        continue-on-error: true
        uses: toitlang/action-macos-sign-notarize@v1.3.0
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          username: ${{ secrets.APPLE_ID_USERNAME }}
          password: ${{ secrets.APPLE_ID_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          app-path: server/build/hardcharger
      - name: Sign and notarize the server (macOS)
        if: matrix.name == 'macos-arm64' && needs.changes.outputs.sign == 'true'
        continue-on-error: true
        uses: toitlang/action-macos-sign-notarize@v1.3.0
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          username: ${{ secrets.APPLE_ID_USERNAME }}
          password: ${{ secrets.APPLE_ID_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          app-path: server/build/hardcharger-server
          entitlements-path: server/macos/entitlements.plist
      # (.github/scripts/verify-macos-signature.sh: Developer ID of our team, hardened runtime,
      # timestamp, notarization ticket, Gatekeeper, entitlements.) Proven to fail first, on the
      # unsigned copy, for that reason. Then the signed binaries run.
      - name: Check the signatures (macOS)
        if: matrix.name == 'macos-arm64' && needs.changes.outputs.sign == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if .github/scripts/verify-macos-signature.sh "$RUNNER_TEMP/unsigned-proof" 2> "$RUNNER_TEMP/proof.err"; then
            echo "the signature check passed an unsigned binary"; exit 1
          fi
          cat "$RUNNER_TEMP/proof.err"
          grep -q "not a Developer ID Application signature" "$RUNNER_TEMP/proof.err"
          .github/scripts/verify-macos-signature.sh \
            --entitlements server/macos/entitlements.plist server/build/hardcharger-server -- server/build/hardcharger
          server/build/hardcharger-server --version
          server/build/hardcharger --version

      - name: Package
        run: |
          # Two self-contained binaries (HARDCHARGER_STATIC: DuckDB and every other
          # dependency linked in, as GizmoSQL's), the licence, the third-party notices (the
          # binaries' and the embedded web UI's) and the changelog; nothing else, never the
          # tests.
          export LC_ALL=C  # the checks below compare sorted globs
          stage="dist/hardcharger-${{ matrix.name }}"
          mkdir -p "$stage/bin"
          install -m 755 server/build/hardcharger-server server/build/hardcharger "$stage/bin/"
          cp LICENSE CHANGELOG.md THIRD_PARTY_NOTICES.md "$stage/"
          tar -xzOf "$HARDCHARGER_UI_TARBALL" hardcharger-ui/third-party-notices.txt > "$stage/THIRD_PARTY_NOTICES-web-ui.txt"
          test "$(cd "$stage" && printf '%s ' *)" = "CHANGELOG.md LICENSE THIRD_PARTY_NOTICES-web-ui.txt THIRD_PARTY_NOTICES.md bin "
          test "$(cd "$stage/bin" && printf '%s ' *)" = "hardcharger hardcharger-server "
          "$stage/bin/hardcharger-server" --version
          "$stage/bin/hardcharger" --version
          # The binaries carry the same notices (--licenses): the server its own and then
          # the web UI's, the client its own.
          "$stage/bin/hardcharger-server" --licenses > "$RUNNER_TEMP/server-licenses.txt"
          { cat "$stage/THIRD_PARTY_NOTICES.md"; printf '\n\n'; cat "$stage/THIRD_PARTY_NOTICES-web-ui.txt"; } \
            > "$RUNNER_TEMP/expected-licenses.txt"
          cmp "$RUNNER_TEMP/server-licenses.txt" "$RUNNER_TEMP/expected-licenses.txt"
          "$stage/bin/hardcharger" --licenses > "$RUNNER_TEMP/client-licenses.txt"
          cmp "$RUNNER_TEMP/client-licenses.txt" "$stage/THIRD_PARTY_NOTICES.md"
          tar -C dist -czf "dist/hardcharger-${{ matrix.name }}.tar.gz" "hardcharger-${{ matrix.name }}"
      # Every shipped executable and library needs glibc 2.28 at most. The check is first
      # shown to fail on a file that needs more (the runner's own libc), so a check that
      # can no longer see symbol versions can't pass by accident.
      - name: Check the glibc baseline (Linux)
        if: runner.os == 'Linux'
        run: |
          libc="/lib/$(uname -m)-linux-gnu/libc.so.6"
          if server/scripts/check-glibc-baseline.sh "$libc" >/dev/null 2>&1; then
            echo "the baseline check passed $libc, which needs a newer glibc"; exit 1
          fi
          stage="dist/hardcharger-${{ matrix.name }}"
          server/scripts/check-glibc-baseline.sh "$stage"/bin/*
      # Nothing shipped may link a library a user's machine may not have: on Linux only
      # glibc's own and the GCC runtime (readelf NEEDED), no RPATH/RUNPATH; on macOS only
      # the OS's /usr/lib and /System/Library/Frameworks (otool -L), no LC_RPATH.
      # The check is first shown to fail on a runner binary that links more (Linux: curl,
      # libcurl; macOS: Homebrew's psql, its libpq and OpenSSL).
      - name: Check the shipped libraries
        run: |
          if [ "$RUNNER_OS" = Linux ]; then probe=/usr/bin/curl; else probe="$(brew --prefix postgresql@17)/bin/psql"; fi
          if server/scripts/check-shipped-libs.sh "$probe" >/dev/null 2>&1; then
            echo "the library check passed $probe, which links more than the system's"; exit 1
          fi
          stage="dist/hardcharger-${{ matrix.name }}"
          server/scripts/check-shipped-libs.sh "$stage"/bin/*
      # The macOS tarball on the runner (the Linux ones go to Oracle Linux 8 in `portable`):
      # it starts, verifies TLS with the system's CA bundle, reads HTTPS inside DuckDB and
      # answers a query through the Chargewire endpoints and its client.
      - name: Smoke-test the tarball (macOS)
        if: runner.os == 'macOS'
        run: env -i HOME="$RUNNER_TEMP" PATH=/usr/bin:/bin bash server/scripts/smoke-tarball.sh "$PWD/dist/hardcharger-${{ matrix.name }}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: hardcharger-${{ matrix.name }}
          path: dist/hardcharger-${{ matrix.name }}.tar.gz
      # versions.json, which the release publishes for machines (GizmoData Cloud): this
      # version and commit, Chargewire's, DuckDB's version name and commit, and the built-in
      # extensions' pins (.github/scripts/versions_json.py), checked against what the packaged
      # server says it is. Made on every run, so a tag never meets it first.
      - name: versions.json (Linux amd64)
        if: matrix.name == 'linux-amd64'
        run: |
          tag=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag=(--tag "$GITHUB_REF_NAME"); fi
          python3 .github/scripts/versions_json.py --binary "dist/hardcharger-${{ matrix.name }}/bin/hardcharger-server" \
            ${tag[@]+"${tag[@]}"} > dist/versions.json
          cat dist/versions.json
      - uses: actions/upload-artifact@v7
        if: matrix.name == 'linux-amd64'
        with:
          name: hardcharger-versions
          path: dist/versions.json
          if-no-files-found: error

  # Compile-cache warm-up. GitHub Actions caches are per branch: a branch restores its own
  # entries and main's, never another branch's. A push to main whose tests are skipped
  # (changes.outputs.tested) runs no build, so it used to leave main no compile cache, and
  # every new branch compiled cold (Windows' "Build the server": ~20 min cold, ~6 warm).
  # These jobs build what the build job builds, with the same steps (YAML anchors: same
  # toolchain, flags and launcher, so the entries match what branch builds look up) and no
  # tests or packages, then save main's sccache directory under the same key scheme, whose
  # prefix is the branches' restore key. Each runs only when changes.outputs.warm lists its
  # platform: main has no entry for the current toolchain less than 7 days old
  # (.github/scripts/stale-compile-caches.sh), so most pushes start none. One job per
  # platform, since a job's `if` can't see its matrix leg. Nothing waits for them (the image
  # job doesn't), and tags never run them. The web UI is the tested run's (built from this
  # commit), so its generated source compiles as in a branch run. Windows: windows.yml's
  # warm-up jobs (`windows-warm` below).
  warm-linux-amd64:
    name: warm compile cache (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.tested == 'true' && contains(needs.changes.outputs.warm, '"linux-amd64"')
    strategy:
      matrix:
        include:
          - *leg-linux-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read  # the tested run's web UI artifact
    env: *build-env
    steps: &warm-steps
      - *build-checkout
      - name: The tested run's web UI
        uses: actions/download-artifact@v8
        with:
          name: hardcharger-ui
          path: server/.web-ui
          run-id: ${{ needs.changes.outputs.tested_run }}
          github-token: ${{ github.token }}
      - *build-ui-tarball
      - *build-submodule
      - *build-tools
      - *build-toolchain
      - *build-dep-openssl
      - *build-dep-arrow
      - *build-dep-replxx
      - *build-dep-duckdb
      - *build-sccache
      - *build-sccache-restore
      - *build-server
      # Only after a whole build (a cancelled one would look fresh to the next push), and
      # even when it added nothing: this entry is what tells the next push main is warm.
      - name: sccache directory (save)
        uses: ./.github/actions/sccache-dir
        with:
          mode: save
          name: ${{ matrix.name }}
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
          force: true

  warm-linux-arm64:
    name: warm compile cache (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.tested == 'true' && contains(needs.changes.outputs.warm, '"linux-arm64"')
    strategy:
      matrix:
        include:
          - *leg-linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env: *build-env
    steps: *warm-steps

  warm-macos-arm64:
    name: warm compile cache (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.tested == 'true' && contains(needs.changes.outputs.warm, '"macos-arm64"')
    strategy:
      matrix:
        include:
          - *leg-macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    # (No build-env: it names the manylinux image, which a macOS leg has none of.)
    steps: *warm-steps

  # The Linux tarballs on the oldest glibc they claim (2.28): installed on Oracle Linux 8,
  # each starts, verifies TLS against the system's CA bundle and answers a query through
  # the health and Chargewire endpoints (server/scripts/smoke-tarball.sh).
  portable:
    name: install on glibc 2.28 (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: server/scripts
      - uses: actions/download-artifact@v8
        with:
          name: hardcharger-${{ matrix.name }}
          path: dist
      - name: Install and run on Oracle Linux 8
        run: |
          cp server/scripts/smoke-tarball.sh dist/
          docker run --rm -v "$PWD/dist:/dist:ro" oraclelinux:8 \
            bash /dist/smoke-tarball.sh "/dist/hardcharger-${{ matrix.name }}.tar.gz"

  # The server and the Chargewire conformance suite again, on an AddressSanitizer build: a
  # use-after-free that only crashed now and then (borrowed DuckDB handles destroyed) fails
  # here every time. The suites fail when the server dies or exits non-zero.
  # On v* tags (the release gate: the image and the release need it to succeed there) and
  # on a manual run with `full`; never on pull requests, branch runs or pushes to main.
  sanitize:
    name: address sanitizer (linux-amd64)
    needs: [changes, web-ui]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.full == true
    runs-on: ubuntu-24.04
    env:
      # Six workers starve the instrumented servers on 2 CPUs (password sign-ins time
      # out); four pass.
      HARDCHARGER_TEST_XDIST_WORKERS: "4"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: hardcharger-ui
          path: server/.web-ui
      - name: The web UI tarball
        run: |
          shopt -s nullglob
          ui=("$PWD"/server/.web-ui/hardcharger-ui-*.tar.gz)
          [ ${#ui[@]} -eq 1 ] || { echo "expected one hardcharger-ui tarball, found: ${ui[*]}"; exit 1; }
          echo "HARDCHARGER_UI_TARBALL=${ui[0]}" >> "$GITHUB_ENV"
      - name: Fetch the chargewire submodule
        run: git submodule update --init --depth 1
      # Build tools for the native server; optional extension libraries load at runtime.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev flex bison
      # The dependencies, uninstrumented (only the server is built with ASan), each cached on its own.
      - name: Toolchain
        id: toolchain
        run: echo "toolchain=$(c++ --version | head -1)" | tee -a "$GITHUB_OUTPUT"
      - name: Arrow (cached)
        uses: ./.github/actions/dep-cache
        with:
          dependency: arrow
          platform: linux-amd64
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
          build: server/scripts/build-deps.sh
      - name: replxx (cached)
        uses: ./.github/actions/dep-cache
        with:
          dependency: replxx
          platform: linux-amd64
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
          build: server/scripts/build-deps.sh
      - name: DuckDB (cached)
        uses: ./.github/actions/dep-cache
        with:
          dependency: duckdb
          platform: linux-amd64
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
          build: server/scripts/build-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache directory (restore)
        uses: ./.github/actions/sccache-dir
        with:
          mode: restore
          name: linux-amd64-asan
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
      - name: Build the server with AddressSanitizer
        run: |
          read -ra launcher <<< "$(server/scripts/sccache-launcher.sh || true)"
          cmake -S server -B server/build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DHARDCHARGER_WEB_UI="$HARDCHARGER_UI_TARBALL" \
            "${launcher[@]}" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          cmake --build server/build-asan
      - name: sccache directory (save)
        if: always()
        uses: ./.github/actions/sccache-dir
        with:
          mode: save
          name: linux-amd64-asan
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
      - name: Start PostgreSQL
        run: |
          docker run -d --name hardcharger-test-pg -e POSTGRES_USER=hardcharger \
            -e POSTGRES_PASSWORD=hardcharger -e POSTGRES_DB=hardcharger \
            -p 127.0.0.1:55433:5432 postgres:17-alpine
          for _ in $(seq 1 30); do docker exec hardcharger-test-pg pg_isready -U hardcharger && break; sleep 1; done
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Test services
        run: docker compose -f server/tests/docker-compose.yml up -d --wait
      - name: Hardcharger tests (ASan)
        working-directory: server/tests
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          HARDCHARGER_TEST_BINARY: ${{ github.workspace }}/server/build-asan/hardcharger-server
          HARDCHARGER_TEST_UNIT_BINARY: ${{ github.workspace }}/server/build-asan/hardcharger-unit-tests
          HARDCHARGER_TEST_CLIENT_BINARY: ${{ github.workspace }}/server/build-asan/hardcharger
          HARDCHARGER_TEST_CLIENT_TESTS_BINARY: ${{ github.workspace }}/server/build-asan/hardcharger-client-tests
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -r pyproject.toml
          # In parallel, then the `serial` tests alone (as in the build job).
          echo "CPUs: $(getconf _NPROCESSORS_ONLN); pytest-xdist workers: $HARDCHARGER_TEST_XDIST_WORKERS"
          .venv/bin/python -m pytest -q -n "$HARDCHARGER_TEST_XDIST_WORKERS" -m "not serial" --durations=10
          .venv/bin/python -m pytest -q -m serial --durations=5
      - name: Chargewire conformance suite (ASan)
        working-directory: third_party/chargewire/conformance
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          CHARGEWIRE_TEST_SERVER_BINARY: ${{ github.workspace }}/server/build-asan/hardcharger-server
          CHARGEWIRE_TEST_SERVER_PASSWORD_ENV: HARDCHARGER_ADMIN_PASSWORD
          CHARGEWIRE_TEST_SERVER_USERNAME: chargewire
          CHARGEWIRE_TEST_SERVER_IDLE_FLAG: --session-idle-timeout
          CHARGEWIRE_TEST_SERVER_LOG: ${{ runner.temp }}/conformance-server.log
          CHARGEWIRE_TEST_SERVER_MTLS_FLAG: --mtls-ca-cert
          # Hardcharger's flag for the CORS allow-list (test_http.py's credentials tests).
          CHARGEWIRE_TEST_SERVER_CORS_FLAG: --cors-origins
          # How test_oauth_browser.py configures browser sign-in on Hardcharger (a template).
          CHARGEWIRE_TEST_SERVER_OAUTH_ARGS: >-
            --token-allowed-issuer {issuer} --token-allowed-audience {client_id} --token-default-role admin
            --token-authorized-emails {identity} --oauth-client-id {client_id} --oauth-base-url {base_url}
            --oauth-provider-name {provider} --oauth-max-flows {max_flows}
          CHARGEWIRE_TEST_SERVER_OAUTH_SECRET_ENV: HARDCHARGER_OAUTH_CLIENT_SECRET
          # One-signal draining (test_lifecycle.py) waits this long for running work.
          CHARGEWIRE_TEST_SERVER_DRAIN_FLAG: --shutdown-grace-period-seconds
          # Metadata and prepared statements under access control (test_authorization.py),
          # on a server of its own with the DuckDB access-control store; privileges go to roles.
          CHARGEWIRE_TEST_AUTHZ_CREATE_USER: "CREATE ROLE {user}_role; CREATE USER {user} WITH PASSWORD '{password}'; GRANT {user}_role TO {user}"
          CHARGEWIRE_TEST_AUTHZ_GRANT: "GRANT SELECT ON {table} TO {user}_role"
          CHARGEWIRE_TEST_AUTHZ_REVOKE: "REVOKE SELECT ON {table} FROM {user}_role"
          HARDCHARGER_ADMIN_USERNAME: chargewire
          HARDCHARGER_PRINT_QUERIES: "false"
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -e .
          key="$(openssl rand -hex 32)"
          export CHARGEWIRE_TEST_AUTHZ_SERVER_ENV="HARDCHARGER_RBAC_STORE_URI=duckdb:{tmp}/rbac.duckdb HARDCHARGER_SECRET_KEY=$key"
          .venv/bin/python -m pytest -q
      - name: Server log
        if: failure()
        run: tail -200 "$RUNNER_TEMP/conformance-server.log" || true

  # ThreadSanitizer: everything instrumented, built with clang (DuckDB with its patches
  # and built-in extensions, Arrow, the extensions' libraries, the server and its unit
  # tests; an uninstrumented dependency hides races and invents false ones), then the
  # server and conformance suites. Each sanitized process writes its reports to a file;
  # any unsuppressed report fails the job (server/tests/tsan.supp holds the few
  # justified third-party suppressions). OpenSSL and the C++ runtime are the system's.
  # When it runs: as the address sanitizer job (v* tags, and a manual run with `full`).
  tsan:
    name: thread sanitizer (linux-amd64)
    needs: [changes, web-ui]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.full == true
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CC: clang
      CXX: clang++
      CFLAGS: -fsanitize=thread -gline-tables-only
      CXXFLAGS: -fsanitize=thread -gline-tables-only
      LDFLAGS: -fsanitize=thread
      # Instrumented servers use several times the memory: fewer workers. They also run
      # several times slower: the waits tests size by hand stretch five times.
      HARDCHARGER_TEST_XDIST_WORKERS: "3"
      HARDCHARGER_TEST_TIMEOUT_SCALE: "5"
      # The serial suites run here for their races and results, not their speed: the
      # TPC-H 30 s limits stretch 15 times (10 clients took 289 s instrumented), and the
      # access-control concurrency test makes 3 passes per client, not 10 (it took 42 min).
      HARDCHARGER_TEST_PERF_SCALE: "15"
      HARDCHARGER_TEST_CONCURRENCY_ROUNDS: "3"
      # Only this unshipped fixture links optional extensions into instrumented DuckDB.
      # Native and ASan jobs exercise the release's signed runtime module behavior.
      HARDCHARGER_TEST_TSAN_EXTENSIONS: "1"
      TSAN_REPORTS: ${{ github.workspace }}/tsan-reports
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: hardcharger-ui
          path: server/.web-ui
      - name: The web UI tarball
        run: |
          shopt -s nullglob
          ui=("$PWD"/server/.web-ui/hardcharger-ui-*.tar.gz)
          [ ${#ui[@]} -eq 1 ] || { echo "expected one hardcharger-ui tarball, found: ${ui[*]}"; exit 1; }
          echo "HARDCHARGER_UI_TARBALL=${ui[0]}" >> "$GITHUB_ENV"
      - name: Fetch the chargewire submodule
        run: git submodule update --init --depth 1
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build libssl-dev flex bison
          clang --version | head -1
      # Recent kernels randomize mmap with more bits than TSan's shadow layout allows
      # ("unexpected memory mapping" at startup), and the dependency builds already run
      # instrumented programs (PostgreSQL's configure checks).
      - name: Lower ASLR entropy for TSan
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      # Instrumented, so their own caches: platform `linux-amd64-tsan`, clang's toolchain.
      - name: Toolchain
        id: toolchain
        run: echo "toolchain=$(clang --version | head -1)" | tee -a "$GITHUB_OUTPUT"
      - name: Arrow (cached)
        uses: ./.github/actions/dep-cache
        with:
          dependency: arrow
          platform: linux-amd64-tsan
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
          build: server/scripts/build-deps.sh
      - name: replxx (cached)
        uses: ./.github/actions/dep-cache
        with:
          dependency: replxx
          platform: linux-amd64-tsan
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
          build: server/scripts/build-deps.sh
      - name: DuckDB (cached)
        uses: ./.github/actions/dep-cache
        with:
          dependency: duckdb
          platform: linux-amd64-tsan
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
          build: server/scripts/build-tsan-duckdb.sh
          extra-recipes: server/scripts/build-tsan-duckdb.sh server/scripts/duckdb-extensions-tsan.cmake server/scripts/duckdb-extensions-ios.cmake server/scripts/build-extension-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache directory (restore)
        uses: ./.github/actions/sccache-dir
        with:
          mode: restore
          name: linux-amd64-tsan
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
      - name: Build the server with ThreadSanitizer
        run: |
          read -ra launcher <<< "$(server/scripts/sccache-launcher.sh || true)"
          cmake -S server -B server/build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DHARDCHARGER_WEB_UI="$HARDCHARGER_UI_TARBALL" \
            "${launcher[@]}"
          cmake --build server/build-tsan
          cmake --build server/build-tsan --target chargewire-sdk-tests
      - name: sccache directory (save)
        if: always()
        uses: ./.github/actions/sccache-dir
        with:
          mode: save
          name: linux-amd64-tsan
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
      - name: Start PostgreSQL
        run: |
          docker run -d --name hardcharger-test-pg -e POSTGRES_USER=hardcharger \
            -e POSTGRES_PASSWORD=hardcharger -e POSTGRES_DB=hardcharger \
            -p 127.0.0.1:55433:5432 postgres:17-alpine
          for _ in $(seq 1 30); do docker exec hardcharger-test-pg pg_isready -U hardcharger && break; sleep 1; done
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Test services
        run: docker compose -f server/tests/docker-compose.yml up -d --wait
      # exitcode=66 marks a process that printed an unsuppressed report; halt_on_error=0
      # keeps going so one run collects every race; log_path gives each process its own
      # report file, which the step after the suites checks.
      # The SDK's unit tests, the security-event limiter's concurrent Admit/Flush among them.
      - name: Chargewire SDK unit tests (TSan)
        env:
          TSAN_OPTIONS: >-
            halt_on_error=0 exitcode=66 second_deadlock_stack=1
            suppressions=${{ github.workspace }}/server/tests/tsan.supp
            log_path=${{ github.workspace }}/tsan-reports/tsan
        run: |
          mkdir -p "$TSAN_REPORTS"
          server/build-tsan/chargewire/chargewire-sdk-tests
      - name: Hardcharger tests (TSan)
        working-directory: server/tests
        env:
          TSAN_OPTIONS: >-
            halt_on_error=0 exitcode=66 second_deadlock_stack=1
            suppressions=${{ github.workspace }}/server/tests/tsan.supp
            log_path=${{ github.workspace }}/tsan-reports/tsan
          HARDCHARGER_TEST_BINARY: ${{ github.workspace }}/server/build-tsan/hardcharger-server
          HARDCHARGER_TEST_UNIT_BINARY: ${{ github.workspace }}/server/build-tsan/hardcharger-unit-tests
          HARDCHARGER_TEST_CLIENT_BINARY: ${{ github.workspace }}/server/build-tsan/hardcharger
          HARDCHARGER_TEST_CLIENT_TESTS_BINARY: ${{ github.workspace }}/server/build-tsan/hardcharger-client-tests
        run: |
          mkdir -p "$TSAN_REPORTS"
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -r pyproject.toml
          echo "CPUs: $(getconf _NPROCESSORS_ONLN); pytest-xdist workers: $HARDCHARGER_TEST_XDIST_WORKERS"
          .venv/bin/python -m pytest -q -n "$HARDCHARGER_TEST_XDIST_WORKERS" -m "not serial" --durations=10
          .venv/bin/python -m pytest -q -m serial --durations=5
      - name: Chargewire conformance suite (TSan)
        if: success() || failure()
        working-directory: third_party/chargewire/conformance
        env:
          TSAN_OPTIONS: >-
            halt_on_error=0 exitcode=66 second_deadlock_stack=1
            suppressions=${{ github.workspace }}/server/tests/tsan.supp
            log_path=${{ github.workspace }}/tsan-reports/tsan
          CHARGEWIRE_TEST_SERVER_BINARY: ${{ github.workspace }}/server/build-tsan/hardcharger-server
          CHARGEWIRE_TEST_SERVER_PASSWORD_ENV: HARDCHARGER_ADMIN_PASSWORD
          CHARGEWIRE_TEST_SERVER_USERNAME: chargewire
          CHARGEWIRE_TEST_SERVER_IDLE_FLAG: --session-idle-timeout
          CHARGEWIRE_TEST_SERVER_MTLS_FLAG: --mtls-ca-cert
          # Hardcharger's flag for the CORS allow-list (test_http.py's credentials tests).
          CHARGEWIRE_TEST_SERVER_CORS_FLAG: --cors-origins
          # How test_oauth_browser.py configures browser sign-in on Hardcharger (a template).
          CHARGEWIRE_TEST_SERVER_OAUTH_ARGS: >-
            --token-allowed-issuer {issuer} --token-allowed-audience {client_id} --token-default-role admin
            --token-authorized-emails {identity} --oauth-client-id {client_id} --oauth-base-url {base_url}
            --oauth-provider-name {provider} --oauth-max-flows {max_flows}
          CHARGEWIRE_TEST_SERVER_OAUTH_SECRET_ENV: HARDCHARGER_OAUTH_CLIENT_SECRET
          # One-signal draining (test_lifecycle.py) waits this long for running work.
          CHARGEWIRE_TEST_SERVER_DRAIN_FLAG: --shutdown-grace-period-seconds
          # Metadata and prepared statements under access control (test_authorization.py),
          # on a server of its own with the DuckDB access-control store; privileges go to roles.
          CHARGEWIRE_TEST_AUTHZ_CREATE_USER: "CREATE ROLE {user}_role; CREATE USER {user} WITH PASSWORD '{password}'; GRANT {user}_role TO {user}"
          CHARGEWIRE_TEST_AUTHZ_GRANT: "GRANT SELECT ON {table} TO {user}_role"
          CHARGEWIRE_TEST_AUTHZ_REVOKE: "REVOKE SELECT ON {table} FROM {user}_role"
          HARDCHARGER_ADMIN_USERNAME: chargewire
          HARDCHARGER_PRINT_QUERIES: "false"
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -e .
          key="$(openssl rand -hex 32)"
          export CHARGEWIRE_TEST_AUTHZ_SERVER_ENV="HARDCHARGER_RBAC_STORE_URI=duckdb:{tmp}/rbac.duckdb HARDCHARGER_SECRET_KEY=$key"
          .venv/bin/python -m pytest -q
      # Any report file means an unsuppressed report: print them all and fail.
      - name: ThreadSanitizer reports
        if: always()
        run: |
          shopt -s nullglob
          reports=("$TSAN_REPORTS"/tsan.*)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No ThreadSanitizer reports." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## ThreadSanitizer: ${#reports[@]} processes reported"
            echo
            grep -h "^SUMMARY: ThreadSanitizer" "${reports[@]}" | sort | uniq -c | sort -rn | sed 's/^/    /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for report in "${reports[@]}"; do
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done
          exit 1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: tsan-reports
          path: tsan-reports/
          if-no-files-found: ignore

  # Built (and smoke-tested) on every run; pushed on a push to main (`:main`, `:sha-*`) and
  # on a v* tag. Skipped jobs don't hold it up (the UI's on an unrelated change, the
  # sanitizers and the signature checks off tags), except on a tag, where every test job
  # and both signature checks must have succeeded, Windows included, before anything is pushed. On a push to main of a commit that
  # already passed (changes.outputs.tested), it takes that run's Linux tarballs: the
  # binaries that were tested, not a rebuild.
  image:
    needs: [changes, build, portable, sanitize, tsan, ui-checks, ui-e2e, windows, verify-macos, verify-windows, ios, ios-archive]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success'
          && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
          && (needs.changes.outputs.tested == 'true' || needs.build.result == 'success')
          && (!startsWith(github.ref, 'refs/tags/v')
              || (needs.build.result == 'success' && needs.portable.result == 'success'
                  && needs.sanitize.result == 'success' && needs.tsan.result == 'success'
                  && needs.ui-checks.result == 'success' && needs.ui-e2e.result == 'success'
                  && needs.windows.result == 'success'
                  && needs.verify-macos.result == 'success' && needs.verify-windows.result == 'success'
                  && needs.ios.result == 'success' && needs.ios-archive.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read  # the tested run's artifacts, when this run reuses them
      packages: write
      id-token: write  # Docker Hub's OIDC sign-in
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.tested != 'true'
        with:
          pattern: hardcharger-linux-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.tested == 'true'
        with:
          pattern: hardcharger-linux-*
          path: artifacts
          merge-multiple: true
          run-id: ${{ needs.changes.outputs.tested_run }}
          github-token: ${{ github.token }}
      - name: Where the binaries come from
        env:
          TESTED_RUN: ${{ needs.changes.outputs.tested_run }}
        run: |
          if [ -n "$TESTED_RUN" ]; then
            echo "The Linux tarballs of run $TESTED_RUN, which tested $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "The Linux tarballs this run built and tested" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          ls -la artifacts
      - name: Unpack
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            tar -C dist -xzf "artifacts/hardcharger-linux-$arch.tar.gz"
          done
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # ghcr.io: on a tag, and on a push to main (the development image, `:main` and
      # `:sha-<short>`, which the drivers' live tests pull; never Docker Hub, never
      # `latest` or a version tag).
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub signs in by OIDC (a trust relationship with this repository, no stored token).
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DOCKERHUB_OIDC_CONNECTIONID: 07b8e4b3-1db1-46b5-a5e1-7d2fff417c60
        with:
          registry: docker.io
          username: gizmodata
      - name: Build (and on a tag or a push to main, push) the image
        run: |
          args=(--tag ghcr.io/gizmodata/hardcharger:dev)
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            args=(--tag ghcr.io/gizmodata/hardcharger:main --tag "ghcr.io/gizmodata/hardcharger:sha-${GITHUB_SHA::7}" --push)
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # vX.Y.Z: :X.Y.Z and :latest; vX.Y.Z-rc.N: :X.Y.Z-rc.N and :sha-<short>, never
            # :latest. Both registries.
            .github/scripts/release.sh check-tag "$GITHUB_REF_NAME"
            tags=$(.github/scripts/release.sh image-tags "${GITHUB_REF_NAME#v}" "$GITHUB_SHA")
            args=()
            while read -r tag; do args+=(--tag "$tag"); done <<< "$tags"
            [ ${#args[@]} -eq 8 ] || { echo "expected 2 tags per registry, got: $tags"; exit 1; }
            printf 'pushing:\n%s\n' "$tags"
            args+=(--push)
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --file docker/Dockerfile "${args[@]}" .
      - name: Smoke-test the image
        run: |
          docker buildx build --platform linux/amd64 --file docker/Dockerfile --tag hc-smoke --load .
          docker run --rm hc-smoke --version
          docker run --rm --entrypoint hardcharger hc-smoke --version
          # The licence and the third-party notices, where Debian-style images keep them.
          docker run --rm --entrypoint sh hc-smoke -c 'cd /usr/share/doc/hardcharger &&
            grep -q "Apache License" LICENSE &&
            grep -qx "# Third-party software in Hardcharger" THIRD_PARTY_NOTICES.md &&
            grep -q "^Hardcharger web UI .*: third-party software notices" THIRD_PARTY_NOTICES-web-ui.txt' 
          docker run -d --name hc -e HARDCHARGER_ADMIN_PASSWORD=smoke -p 31337:31337 -p 31338:31338 hc-smoke
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:31338/health && break; sleep 1; done
          curl -sf http://127.0.0.1:31337/chargewire
          # The client in the image reaches the server it runs beside.
          docker exec -e HARDCHARGER_PASSWORD=smoke hc hardcharger --host 127.0.0.1 --tls=false --username hardcharger \
            --csv --no-header -c "SELECT 'image client'" | grep -qx 'image client'
          docker logs hc
          docker rm -f hc

  # Windows x64 and arm64 (windows.yml): its build and tests, and the zips and MSIs it
  # packages, which the checksums and the release take with the tarballs.
  windows:
    needs: [changes, web-ui]
    if: needs.changes.outputs.tested != 'true'
    uses: ./.github/workflows/windows.yml
    secrets: inherit
    with:
      failure_repro: ${{ inputs.failure_repro == true }}
      sign: ${{ needs.changes.outputs.sign == 'true' }}
    # actions: read for windows.yml's warm-up jobs (skipped here), id-token: write for its
    # signing jobs' Azure sign-in (used only when signing): a called workflow's jobs may ask
    # only for what the caller grants, checked before any job is skipped.
    permissions:
      contents: read
      actions: read
      id-token: write

  # Windows' compile-cache warm-up (the warm-* jobs above, for windows-amd64 and windows-arm64).
  windows-warm:
    needs: changes
    if: >-
      needs.changes.outputs.tested == 'true'
      && (contains(needs.changes.outputs.warm, '"windows-amd64"') || contains(needs.changes.outputs.warm, '"windows-arm64"'))
    uses: ./.github/workflows/windows.yml
    secrets: inherit
    with:
      warm: ${{ needs.changes.outputs.warm }}
      tested_run: ${{ needs.changes.outputs.tested_run }}
    permissions:
      contents: read
      actions: read
      id-token: write  # asked for by windows.yml's signing jobs (skipped here)

  # The signatures of exactly what the checksums and the release take (the hardcharger-*
  # artifacts), checked once more on runners of their own, whenever this run signs. On a v*
  # tag the image and the release need both, so no tag publishes an unsigned binary, even if
  # a signing step were skipped by mistake. Each check is first shown to refuse a copy of a
  # signed binary with one byte changed.
  # The iOS app on the simulator: the server cross-built for it (ios/scripts/
  # build-server-ios.sh, with its smoke test inside a booted simulator), then the app's
  # unit tests and UI tests (splash, web UI, console, settings, sharing). The dependency
  # builds are cached on their recipes and the exact Xcode (a new Xcode rebuilds them cold).
  ios:
    name: iOS app (simulator build and tests)
    needs: [changes, web-ui]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.ios)
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - *build-checkout
      - uses: actions/download-artifact@v8
        with:
          name: hardcharger-ui
          path: ui/release
      - *build-submodule
      - &ios-tools
        name: Tools and toolchain
        id: ios-toolchain
        run: |
          brew install ninja xcodegen
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | tr '\n' ' ' | tr -s ' ')" >> "$GITHUB_OUTPUT"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
      - &ios-deps-cache
        name: iOS dependencies (cached)
        uses: actions/cache@v5
        with:
          path: |
            ios/build/iphonesimulator/deps/*-install
            ios/build/iphoneos/deps/*-install
          key: ios-deps-${{ steps.ios-toolchain.outputs.xcode }}-${{ hashFiles('server/scripts/build-deps.sh', 'server/scripts/deps-*.sh', 'server/scripts/build-extension-deps.sh', 'server/scripts/build-replxx.sh', 'server/scripts/patch-duckdb*.cmake', 'server/scripts/retire-ducklake-patch.cmake', 'server/scripts/duckdb-extensions-ios.cmake', 'third_party/chargewire/cpp/scripts/*.sh', 'ios/cmake/ios.toolchain.cmake') }}
      - name: Cross-build the server for the simulator, smoke-test it in one
        run: ios/scripts/build-server-ios.sh iphonesimulator
      - name: Unit and UI tests
        run: |
          ios/scripts/generate-project.sh
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True):
              if "iOS" in runtime:
                  for d in devices:
                      if d["name"].startswith("iPhone"):
                          print(d["udid"]); sys.exit()')
          [ -n "$device" ] || { echo "no iPhone simulator"; exit 1; }
          xcodebuild test -project ios/Hardcharger.xcodeproj -scheme Hardcharger \
            -destination "id=$device" -derivedDataPath ios/build/DerivedData \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ios-tests.xcresult
          if-no-files-found: ignore

  # The signed device build, on a v* tag only, after the simulator tests passed: an App
  # Store-signed .ipa as this run's artifact. Nothing is uploaded to App Store Connect or
  # TestFlight (Philip decides; the App Store Connect key in `production` is for that later,
  # uploaded to TestFlight). Manual signing with the distribution certificate and the "Hardcharger App
  # Store" profile, in a keychain of the run's own that is deleted afterwards.
  ios-archive:
    name: iOS app (signed device build)
    needs: [changes, web-ui, ios]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.ios && inputs.sign)
    runs-on: macos-26
    environment: production
    timeout-minutes: 180
    steps:
      - *build-checkout
      - uses: actions/download-artifact@v8
        with:
          name: hardcharger-ui
          path: ui/release
      - *build-submodule
      - *ios-tools
      - *ios-deps-cache
      - name: Cross-build the server for devices
        run: ios/scripts/build-server-ios.sh iphoneos
      - name: Install the signing certificate and profile
        env:
          IOS_DIST_CERT_B64: ${{ secrets.IOS_DIST_CERT_B64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
        run: ios/scripts/ci-signing.sh install
      - name: Archive and export the .ipa
        run: |
          # The build number grows with every run, so each upload of a version is new.
          HARDCHARGER_IOS_BUILD_NUMBER="${{ github.run_number }}" ios/scripts/generate-project.sh
          ios/scripts/ci-signing.sh archive "$RUNNER_TEMP/ios-export"
      - name: Remove the signing keychain and profile
        if: always()
        run: ios/scripts/ci-signing.sh cleanup
      - uses: actions/upload-artifact@v7
        with:
          name: hardcharger-ios-ipa
          path: ${{ runner.temp }}/ios-export/*.ipa
          if-no-files-found: error
      # TestFlight, on release tags (Philip, 2026-10-20: "add the upload step to CI - we do that in
      # GizmoSQL"). The App Store Connect API key lives only for this step; the build number is the
      # run number, so every upload of a version is a new build. A failed upload fails the gate
      # (the .ipa is already the run's artifact, so it can be uploaded by hand).
      - name: Upload to TestFlight
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ASC_KEY_B64: ${{ secrets.ASC_KEY_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          [ -n "$ASC_KEY_B64" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] || { echo "::error::ASC_KEY_B64 / ASC_KEY_ID / ASC_ISSUER_ID are not all set"; exit 1; }
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_B64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          shopt -s nullglob
          ipas=("$RUNNER_TEMP"/ios-export/*.ipa)
          [ "${#ipas[@]}" -eq 1 ] || { echo "::error::expected exactly one exported .ipa"; exit 1; }
          xcrun altool --upload-app -f "${ipas[0]}" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove the App Store Connect key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect"

  verify-macos:
    name: verify signatures (macos-arm64)
    needs: [changes, build]
    if: needs.changes.outputs.sign == 'true'
    runs-on: macos-15
    environment: production  # APPLE_TEAM_ID, the team the signature must name
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            server/macos
      - uses: actions/download-artifact@v8
        with:
          name: hardcharger-macos-arm64
          path: dist
      - name: Check the signatures, then run the binaries
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          tar -C "$RUNNER_TEMP" -xzf dist/hardcharger-macos-arm64.tar.gz
          bin="$RUNNER_TEMP/hardcharger-macos-arm64/bin"
          tampered="$RUNNER_TEMP/tampered"
          cp "$bin/hardcharger" "$tampered"
          perl -e 'open(my $f, "+<", $ARGV[0]) or die; seek($f, 20000, 0); read($f, my $b, 1); seek($f, 20000, 0); print $f chr(ord($b) ^ 0xff); close($f) or die' "$tampered"
          if cmp -s "$bin/hardcharger" "$tampered"; then echo "the copy was not modified"; exit 1; fi
          if .github/scripts/verify-macos-signature.sh "$tampered" 2> "$RUNNER_TEMP/proof.err"; then
            echo "the signature check passed a modified binary"; exit 1
          fi
          cat "$RUNNER_TEMP/proof.err"
          grep -q "missing, broken or not strictly valid" "$RUNNER_TEMP/proof.err"
          .github/scripts/verify-macos-signature.sh \
            --entitlements server/macos/entitlements.plist "$bin/hardcharger-server" -- "$bin/hardcharger"
          "$bin/hardcharger-server" --version
          "$bin/hardcharger" --version

  # Windows on Arm runs both platforms' executables (x64 emulated), so the signed arm64
  # executables run here too (windows.yml's sign job, on x64, can run only the x64 ones).
  verify-windows:
    name: verify signatures (windows)
    needs: [changes, windows]
    if: needs.changes.outputs.sign == 'true'
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: hardcharger-windows-*
          path: dist
          merge-multiple: true
      - name: Check the signatures, then run the executables
        run: |
          $files = @()
          foreach ($platform in 'windows-amd64', 'windows-arm64') {
            Expand-Archive "dist/hardcharger-$platform.zip" -DestinationPath unpacked
            $files += "unpacked/hardcharger-$platform/bin/hardcharger-server.exe", "unpacked/hardcharger-$platform/bin/hardcharger.exe"
          }
          $exes = $files
          $files += "dist/Hardcharger-windows-amd64.msi", "dist/Hardcharger-windows-arm64.msi"
          $tampered = Join-Path $PWD 'tampered.exe'
          Copy-Item $exes[0] $tampered
          $bytes = [IO.File]::ReadAllBytes($tampered)
          $bytes[0x2000] = $bytes[0x2000] -bxor 0xff
          [IO.File]::WriteAllBytes($tampered, $bytes)
          pwsh -NoProfile -File .github/scripts/verify-windows-signature.ps1 $tampered *> proof.log
          $refused = $LASTEXITCODE
          Get-Content proof.log
          if ($refused -eq 0) { throw "the signature check passed a modified executable" }
          if (-not (Select-String -Quiet -SimpleMatch -Pattern 'signature status HashMismatch' -Path proof.log)) {
            throw "the signature check refused the modified executable, but not as modified"
          }
          pwsh -NoProfile -File .github/scripts/verify-windows-signature.ps1 @files
          if ($LASTEXITCODE -ne 0) { throw "the release's Windows files failed the signature check" }
          foreach ($exe in $exes) {
            & $exe --version
            if ($LASTEXITCODE -ne 0) { throw "$exe did not run" }
          }

  # SHA256SUMS for the release tarballs (and any zip), in `sha256sum -c` format: made and
  # checked on every run, so the release (and the one-line installer, which verifies
  # downloads against it) never meets it for the first time on a tag.
  desktop:
    needs: [changes, build, windows]
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/desktop.yml
    with:
      native_run: ${{ github.run_id }}
      sign: ${{ needs.changes.outputs.sign == 'true' }}
    secrets: inherit

  checksums:
    needs: [build, windows, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: hardcharger-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          shopt -s nullglob
          # The desktop update package (.app.tar.gz) exists on signed runs only.
          assets=(hardcharger-*.tar.gz hardcharger-*.zip Hardcharger-*.msi Hardcharger-desktop-*.dmg Hardcharger-desktop-*.app.zip Hardcharger-desktop-*.app.tar.gz)
          # Three tarballs (Linux amd64/arm64, macOS), two Windows zips and two MSIs.
          [ ${#assets[@]} -ge 11 ] || { echo "expected native and desktop release assets, found: ${assets[*]}"; exit 1; }
          sha256sum "${assets[@]}" > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: hardcharger-SHA256SUMS
          path: dist/SHA256SUMS

  # On every v* tag, whatever happened before it, so that a tag whose gate didn't pass fails
  # here, visibly, rather than skipping the release in a run that looks green: its first step
  # fails unless every job it needs succeeded (none skipped) and the run signed.
  release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [changes, build, portable, sanitize, tsan, ui-checks, ui-e2e, image, windows, checksums, verify-macos, verify-windows, ios, ios-archive, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Every gate passed, the signature checks included
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          SIGN: ${{ needs.changes.outputs.sign }}
          MACOS: ${{ needs.verify-macos.result }}
          WINDOWS: ${{ needs.verify-windows.result }}
        run: |
          echo "needed jobs: $RESULTS"
          echo "signed: $SIGN; macOS signatures: $MACOS; Windows signatures: $WINDOWS"
          [ "$(jq -r 'length' <<< "$RESULTS")" -eq 15 ] || { echo "expected the results of 15 jobs"; exit 1; }
          [ "$(jq -r 'map(select(. != "success")) | length' <<< "$RESULTS")" -eq 0 ] || { echo "a needed job did not succeed"; exit 1; }
          [ "$SIGN" = true ] && [ "$MACOS" = success ] && [ "$WINDOWS" = success ] || { echo "the release is not signed"; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: hardcharger-*
          path: dist
          merge-multiple: true
      - name: Check the tag matches the server version
        run: .github/scripts/release.sh check-tag "$GITHUB_REF_NAME"
      # The section `## [X.Y.Z]` or `## [X.Y.Z-rc.N]`, matched as text; none (or an empty
      # one) fails the release.
      - name: Extract this version's CHANGELOG section
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          .github/scripts/release.sh changelog "$version" > release-notes.md
          echo "prerelease=$(.github/scripts/release.sh prerelease "$version")" | tee -a "$GITHUB_OUTPUT"
      # versions.json (from the build job) describes this release: its version is the tag's.
      - name: Check versions.json
        run: |
          test -f dist/versions.json || { echo "no versions.json (the build job's hardcharger-versions artifact)"; exit 1; }
          [ "v$(jq -r .hardcharger.version dist/versions.json)" = "$GITHUB_REF_NAME" ] \
            || { echo "versions.json is for $(jq -r .hardcharger.version dist/versions.json), not $GITHUB_REF_NAME"; exit 1; }
          [ "$(jq -r .hardcharger.commit dist/versions.json)" = "$GITHUB_SHA" ] \
            || { echo "versions.json is for commit $(jq -r .hardcharger.commit dist/versions.json), not $GITHUB_SHA"; exit 1; }
      # The checksums cover exactly the assets that are about to be published.
      - name: Check SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS
          shopt -s nullglob
          for asset in hardcharger-*.tar.gz hardcharger-*.zip Hardcharger-*.msi Hardcharger-desktop-*.dmg Hardcharger-desktop-*.app.zip Hardcharger-desktop-*.app.tar.gz; do
            grep -q "  $asset\$" SHA256SUMS || { echo "$asset is not in SHA256SUMS"; exit 1; }
          done
      # The desktop app's update feed (gizmodata/hardcharger#7): every platform's update package
      # must be here and verify with the updater key for exactly this version, or nothing is
      # published. releases/latest/download/latest.json is what stable users' apps read.
      - name: Build the desktop update feed
        run: |
          sudo apt-get install -y -q minisign > /dev/null
          version="${GITHUB_REF_NAME#v}"
          python3 .github/scripts/updater_feed.py --version "$version" --notes release-notes.md --dist dist \
            --base-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            --config desktop/src-tauri/tauri.conf.json > dist/latest.json
          jq -e '.platforms | length == 3' dist/latest.json
      # A release candidate is a pre-release, which GitHub never makes the latest release
      # (what install.sh and releases/latest resolve); a release is made the latest.
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/*
          prerelease: ${{ steps.notes.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.notes.outputs.prerelease == 'true' && 'false' || 'true' }}

  # What follows a published release: the matching `hardcharger` Python package (workflow.yml)
  # and the bundled-driver images :X.Y.Z-adbc (adbc-images.yml). Only after the release job
  # succeeded, so only for a v* tag whose every gate, signature check and GitHub Release did;
  # each dispatched run runs its own tests on the tag before it publishes. This job waits for
  # both and fails when either does, and checks PyPI and both registries afterwards: a release
  # isn't done until its downstream publishes are confirmed.
  downstream:
    if: ${{ !cancelled() && needs.release.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Dispatch the Python package and the ADBC images
        id: dispatch
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The newest stable driver release (GitHub's latest is never a draft or pre-release).
          driver=$(gh release view --repo gizmodata/hardcharger-adbc --json tagName --jq .tagName)
          [[ "$driver" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "no stable hardcharger-adbc release ($driver)"; exit 1; }
          echo "hardcharger-adbc driver: $driver"
          # Prints the dispatched run's id: from gh's run URL, else the newest dispatch on this tag
          # since the call.
          dispatch() {
            local workflow="$1" since url id
            shift
            since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            url=$(gh workflow run "$workflow" --ref "$GITHUB_REF_NAME" "$@" | grep -oE 'https://[^ ]+/actions/runs/[0-9]+' | tail -1 || true)
            id="${url##*/}"
            for _ in $(seq 1 30); do
              [ -n "$id" ] && break
              sleep 5
              id=$(gh run list --workflow "$workflow" --event workflow_dispatch --branch "$GITHUB_REF_NAME" \
                     --json databaseId,createdAt --jq "map(select(.createdAt >= \"$since\")) | .[0].databaseId // empty")
            done
            [ -n "$id" ] || { echo "no run of $workflow started" >&2; return 1; }
            echo "$workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id" >&2
            echo "$id"
          }
          python=$(dispatch workflow.yml -f release="$version")
          adbc=$(dispatch adbc-images.yml -f server_version="$version" -f driver_tag="$driver" -f publish=true)
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "adbc=$adbc" >> "$GITHUB_OUTPUT"
      - name: Wait for both to publish
        env:
          PYTHON_RUN: ${{ steps.dispatch.outputs.python }}
          ADBC_RUN: ${{ steps.dispatch.outputs.adbc }}
        run: |
          failed=0
          gh run watch "$PYTHON_RUN" --exit-status --interval 30 > /dev/null || { echo "::error::the Python package run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$PYTHON_RUN"; failed=1; }
          gh run watch "$ADBC_RUN" --exit-status --interval 30 > /dev/null || { echo "::error::the ADBC images run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$ADBC_RUN"; failed=1; }
          exit "$failed"
      - name: Confirm PyPI and the registries have them
        run: |
          version="${GITHUB_REF_NAME#v}"
          package=$(python3 -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')
          # PyPI's JSON API can trail the upload by a minute or two.
          for i in $(seq 1 20); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/hardcharger/$package/json")" = 200 ] && break
            [ "$i" -lt 20 ] || { echo "::error::PyPI has no hardcharger $package"; exit 1; }
            sleep 15
          done
          echo "PyPI: hardcharger $package"
          for image in "ghcr.io/gizmodata/hardcharger:$version-adbc" "docker.io/gizmodata/hardcharger:$version-adbc"; do
            docker buildx imagetools inspect "$image" > /dev/null || { echo "::error::$image is missing"; exit 1; }
            echo "image: $image"
          done

  # One Slack message per release tag (gizmodata/.github's notify-slack, org secret
  # SLACK_RELEASES_WEBHOOK_URL): released once PyPI and the images are confirmed, or what failed.
  # It never fails the run.
  notify:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [release, downstream]
    permissions: {}
    uses: gizmodata/.github/.github/workflows/notify-slack.yml@fc54ee6c92379ae9cd1fecedabf8f382d1fdb2ed
    with:
      status: >-
        ${{ needs.release.result == 'success' && needs.downstream.result == 'success' && 'success'
        || (needs.release.result == 'cancelled' || needs.downstream.result == 'cancelled') && 'cancelled'
        || 'failure' }}
      title: >-
        ${{ needs.release.result != 'success' && format('Hardcharger {0}: not released (the release gate did not pass)', github.ref_name)
        || needs.downstream.result != 'success' && format('Hardcharger {0} released, but PyPI or the ADBC images did not publish', github.ref_name)
        || format('Hardcharger {0} released', github.ref_name) }}
      details: >-
        ${{ needs.release.result == 'success' && needs.downstream.result == 'success'
        && 'Published and checked: the GitHub Release, PyPI hardcharger, and the server and ADBC images on ghcr.io and Docker Hub.'
        || '' }}
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    secrets:
      SLACK_RELEASES_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
