# Temporary TSan-only proof; never merge this workflow into the release.
name: server
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
env:
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 2G
  HARDCHARGER_TEST_XDIST_WORKERS: '6'
jobs:
  tsan:
    name: thread sanitizer (linux-amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CC: clang
      CXX: clang++
      CFLAGS: -fsanitize=thread -gline-tables-only
      CXXFLAGS: -fsanitize=thread -gline-tables-only
      LDFLAGS: -fsanitize=thread
      HARDCHARGER_TEST_XDIST_WORKERS: '3'
      HARDCHARGER_TEST_TIMEOUT_SCALE: '5'
      HARDCHARGER_TEST_PERF_SCALE: '15'
      HARDCHARGER_TEST_CONCURRENCY_ROUNDS: '3'
      HARDCHARGER_TEST_TSAN_EXTENSIONS: '1'
      TSAN_REPORTS: ${{ github.workspace }}/tsan-reports
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: hardcharger-ui
        path: server/.web-ui
        run-id: 44804271759
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: The web UI tarball
      run: 'shopt -s nullglob

        ui=("$PWD"/server/.web-ui/hardcharger-ui-*.tar.gz)

        [ ${#ui[@]} -eq 1 ] || { echo "expected one hardcharger-ui tarball, found: ${ui[*]}"; exit 1; }

        echo "HARDCHARGER_UI_TARBALL=${ui[0]}" >> "$GITHUB_ENV"

        '
    - name: Fetch the chargewire submodule
      run: git submodule update --init --depth 1
    - name: Install build tools
      run: 'sudo apt-get update

        sudo apt-get install -y --no-install-recommends clang ninja-build libssl-dev flex bison

        clang --version | head -1

        '
    - name: Lower ASLR entropy for TSan
      run: sudo sysctl -w vm.mmap_rnd_bits=28
    - name: Toolchain
      id: toolchain
      run: echo "toolchain=$(clang --version | head -1)" | tee -a "$GITHUB_OUTPUT"
    - name: Arrow (cached)
      uses: ./.github/actions/dep-cache
      with:
        dependency: arrow
        platform: linux-amd64-tsan
        toolchain: ${{ steps.toolchain.outputs.toolchain }}
        build: server/scripts/build-deps.sh
    - name: replxx (cached)
      uses: ./.github/actions/dep-cache
      with:
        dependency: replxx
        platform: linux-amd64-tsan
        toolchain: ${{ steps.toolchain.outputs.toolchain }}
        build: server/scripts/build-deps.sh
    - name: DuckDB (cached)
      uses: ./.github/actions/dep-cache
      with:
        dependency: duckdb
        platform: linux-amd64-tsan
        toolchain: ${{ steps.toolchain.outputs.toolchain }}
        build: server/scripts/build-tsan-duckdb.sh
        extra-recipes: server/scripts/build-tsan-duckdb.sh server/scripts/duckdb-extensions-tsan.cmake server/scripts/duckdb-extensions-ios.cmake
          server/scripts/build-extension-deps.sh
    - uses: mozilla-actions/sccache-action@v0.0.11
    - name: sccache directory (restore)
      uses: ./.github/actions/sccache-dir
      with:
        mode: restore
        name: linux-amd64-tsan
        toolchain: ${{ steps.toolchain.outputs.toolchain }}
    - name: Build the server with ThreadSanitizer
      run: "read -ra launcher <<< \"$(server/scripts/sccache-launcher.sh || true)\"\ncmake -S server -B server/build-tsan\
        \ -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \\\n  -DHARDCHARGER_WEB_UI=\"$HARDCHARGER_UI_TARBALL\" \\\n  \"${launcher[@]}\"\
        \ncmake --build server/build-tsan\ncmake --build server/build-tsan --target chargewire-sdk-tests\n"
    - name: sccache directory (save)
      if: always()
      uses: ./.github/actions/sccache-dir
      with:
        mode: save
        name: linux-amd64-tsan
        toolchain: ${{ steps.toolchain.outputs.toolchain }}
    - name: Start PostgreSQL
      run: "docker run -d --name hardcharger-test-pg -e POSTGRES_USER=hardcharger \\\n  -e POSTGRES_PASSWORD=hardcharger -e\
        \ POSTGRES_DB=hardcharger \\\n  -p 127.0.0.1:55433:5432 postgres:17-alpine\nfor _ in $(seq 1 30); do docker exec hardcharger-test-pg\
        \ pg_isready -U hardcharger && break; sleep 1; done\n"
    - uses: astral-sh/setup-uv@v10.3.0
    - name: Test services
      run: docker compose -f server/tests/docker-compose.yml up -d --wait
    - name: Prove permission fixture isolation under TSan
      working-directory: server/tests
      env:
        TSAN_OPTIONS: halt_on_error=0 exitcode=66 second_deadlock_stack=1 suppressions=${{ github.workspace }}/server/tests/tsan.supp
          log_path=${{ github.workspace }}/tsan-reports/tsan
        HARDCHARGER_TEST_BINARY: ${{ github.workspace }}/server/build-tsan/hardcharger-server
        HARDCHARGER_TEST_UNIT_BINARY: ${{ github.workspace }}/server/build-tsan/hardcharger-unit-tests
        HARDCHARGER_TEST_CLIENT_BINARY: ${{ github.workspace }}/server/build-tsan/hardcharger
        HARDCHARGER_TEST_CLIENT_TESTS_BINARY: ${{ github.workspace }}/server/build-tsan/hardcharger-client-tests
      run: "set -euo pipefail\nmkdir -p \"$TSAN_REPORTS\"\nuv venv .venv --python 3.14\nuv pip install --python .venv/bin/python\
        \ -r pyproject.toml\n.venv/bin/python -m pytest -q test_bind_time_checks.py test_ducklake_calls.py\ntest -z \"$(find\
        \ \"$TSAN_REPORTS\" -name 'tsan.*' -print -quit)\"\ncp test_bind_time_checks.py \"$RUNNER_TEMP/test_bind_time_checks.fixed.py\"\
        \npython3 - <<'PY'\nfrom pathlib import Path\np = Path('test_bind_time_checks.py')\ns = p.read_text()\nassert s.count('if\
        \ TSAN_EXTENSIONS else []') == 1\np.write_text(s.replace('if TSAN_EXTENSIONS else []', 'if False else []'))\nPY\n\
        mkdir -p \"$GITHUB_WORKSPACE/tsan-mutation\"\nset +e\nTSAN_OPTIONS=\"${TSAN_OPTIONS/tsan-reports\\/tsan/tsan-mutation\\\
        /tsan}\" \\\n  .venv/bin/python -m pytest -q test_bind_time_checks.py -k 'storage_privileges_everywhere and delta'\
        \ \\\n  > \"$RUNNER_TEMP/delta-mutation.log\" 2>&1\nmutation_status=$?\nset -e\ncat \"$RUNNER_TEMP/delta-mutation.log\"\
        \ntest \"$mutation_status\" -ne 0\ngrep -l 'delta.duckdb_extension' \"$GITHUB_WORKSPACE\"/tsan-mutation/tsan.*\ncp\
        \ \"$RUNNER_TEMP/test_bind_time_checks.fixed.py\" test_bind_time_checks.py\n.venv/bin/python -m pytest -q test_bind_time_checks.py\
        \ test_ducklake_calls.py\n"
    - name: ThreadSanitizer reports
      if: always()
      run: "shopt -s nullglob\nreports=(\"$TSAN_REPORTS\"/tsan.*)\nif [ ${#reports[@]} -eq 0 ]; then\n  echo \"No ThreadSanitizer\
        \ reports.\" | tee -a \"$GITHUB_STEP_SUMMARY\"\n  exit 0\nfi\n{\n  echo \"## ThreadSanitizer: ${#reports[@]} processes\
        \ reported\"\n  echo\n  grep -h \"^SUMMARY: ThreadSanitizer\" \"${reports[@]}\" | sort | uniq -c | sort -rn | sed\
        \ 's/^/    /'\n} | tee -a \"$GITHUB_STEP_SUMMARY\"\nfor report in \"${reports[@]}\"; do\n  echo \"::group::$report\"\
        \n  cat \"$report\"\n  echo \"::endgroup::\"\ndone\nexit 1\n"
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: tsan-reports
        path: tsan-reports/
        if-no-files-found: ignore
