[project]
name = "hardcharger-server-tests"
version = "0.2.0"
description = "Tests for the Hardcharger server"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=50.0.2",
  "httpx>=0.28.1",
  "psycopg[binary]>=3.3.6",
  "pexpect>=4.9.0",
  "pyarrow>=26.0.0",
  "pyjwt>=2.15.1",
  "pytest>=9.1.1",
  "pytest-xdist>=3.8.0",
  "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["."]
markers = [
  "performance: throughput gates (slow)",
  "services: needs the containers in docker-compose.yml (PostgreSQL, S3); fails, never skips, without them",
  "serial: runs alone, after the parallel (pytest-xdist) pass: timing gates, and counts over a whole shared database",
  "rbac_store: takes the `store` fixture, so it runs on the store HARDCHARGER_TEST_RBAC_STORE picks (CI: PostgreSQL, then the DuckDB file)",
  "pty: drives the client at a terminal through pexpect.spawn, which needs a pty: Windows has none, and its CI deselects these by marker",
  "web_ui: needs a build that embeds the web UI (-DHARDCHARGER_WEB_UI=<hardcharger-ui tarball>); fails, never skips, without it",
]
