[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "hardcharger"
version = "0.0.1"
description = "Hardcharger, the analytics server from GizmoData (coming soon)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "GizmoData LLC" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://gizmodata.com"

[dependency-groups]
dev = ["pytest>=9.1.1"]
